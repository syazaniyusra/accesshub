<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bismi — Login</title>
  <script>const API = window.location.origin;</script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --pink:        #D4186C;
      --pink-hover:  #B5135C;
      --pink-soft:   #FCE8F3;
      --pink-pill:   #F9D5EA;
      --ink:         #1C1C1E;
      --ink-mid:     #5A5A6E;
      --ink-light:   #9999AA;
      --ink-faint:   #D0D0DA;
      --surface:     #FDFCFB;
      --surface-2:   #FAF9F6;
      --border:      #E2DDD7;
      --r-sm:        8px;
      --r-md:        12px;
      --r-lg:        18px;
      --shadow-card: 0 1px 4px rgba(0,0,0,0.06), 0 8px 32px rgba(0,0,0,0.08);
      --shadow-focus:0 0 0 3px rgba(212,24,108,0.18);
      --font:        'Plus Jakarta Sans', sans-serif;
      --font-display:'DM Serif Display', serif;
      --t:           160ms;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--surface-2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }

    /* Decorative background blobs */
    body::before {
      content: '';
      position: fixed;
      top: -120px; right: -120px;
      width: 420px; height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212,24,108,0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -100px; left: -100px;
      width: 360px; height: 360px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212,24,108,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── CARD ── */
    .login-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 24px;
      padding: 44px 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow-card);
      animation: cardIn 0.4s cubic-bezier(.34,1.56,.64,1) both;
      position: relative;
      z-index: 1;
    }

    @keyframes cardIn {
      from { transform: translateY(24px) scale(0.97); opacity: 0; }
      to   { transform: translateY(0)    scale(1);    opacity: 1; }
    }

    /* ── BRAND ── */
    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 32px;
    }

    .brand-logo-wrap {
      width: 48px; height: 48px;
      border-radius: 13px;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .brand-logo {
      width: 34px; height: 34px;
      object-fit: contain;
      border-radius: 7px;
    }

    .brand-text { display: flex; flex-direction: column; gap: 3px; }

    .brand-name {
      font-family: var(--font-display);
      font-size: 26px;
      color: var(--ink);
      line-height: 1;
    }

    .brand-sub {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--pink);
    }

    /* ── HEADING ── */
    .login-heading {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--ink);
      margin-bottom: 5px;
    }

    .login-sub {
      font-size: 13px;
      color: var(--ink-light);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* ── ERROR ── */
    .error-box {
      display: none;
      background: #FFF1F2;
      border: 1px solid #FECDD3;
      border-radius: var(--r-sm);
      padding: 10px 14px;
      font-size: 13px;
      color: #E11D48;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .error-box.hidden { display: none !important; }
    .error-box i { font-size: 13px; flex-shrink: 0; }

    /* ── FORM GROUPS ── */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 16px;
    }

    .form-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: var(--ink-light);
    }

    /* INPUT WRAP */
    .input-wrap {
      display: flex;
      align-items: center;
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      background: var(--surface);
      overflow: hidden;
      transition: border-color var(--t), box-shadow var(--t);
    }

    .input-wrap:focus-within {
      border-color: var(--pink);
      box-shadow: var(--shadow-focus);
    }

    .input-wrap .input-icon {
      padding: 0 13px;
      color: var(--ink-faint);
      font-size: 13px;
      flex-shrink: 0;
      transition: color var(--t);
    }

    .input-wrap:focus-within .input-icon {
      color: var(--pink);
    }

    .input-wrap input {
      flex: 1;
      border: none;
      outline: none;
      padding: 12px 14px 12px 0;
      font-size: 14px;
      font-family: var(--font);
      color: var(--ink);
      background: transparent;
    }

    .input-wrap input::placeholder {
      color: var(--ink-faint);
    }

    .toggle-pw {
      border: none;
      background: transparent;
      padding: 0 13px;
      cursor: pointer;
      color: var(--ink-light);
      font-size: 13px;
      height: 44px;
      display: flex; align-items: center;
      transition: color var(--t);
    }
    .toggle-pw:hover { color: var(--pink); }

    /* ── REMEMBER ROW ── */
    .remember-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 24px;
    }

    .remember-row input[type="checkbox"] {
      width: 16px; height: 16px;
      accent-color: var(--pink);
      cursor: pointer;
      flex-shrink: 0;
    }

    .remember-row label {
      font-size: 13px;
      color: var(--ink-mid);
      cursor: pointer;
      font-weight: 500;
    }

    /* ── LOGIN BUTTON ── */
    .login-btn {
      width: 100%;
      padding: 13px;
      background: var(--pink);
      color: #fff;
      border: none;
      border-radius: var(--r-sm);
      font-size: 14.5px;
      font-weight: 700;
      font-family: var(--font);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      gap: 9px;
      transition: background var(--t), transform var(--t), box-shadow var(--t);
      box-shadow: 0 4px 14px rgba(212,24,108,0.25);
    }

    .login-btn:hover {
      background: var(--pink-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(212,24,108,0.32);
    }

    .login-btn:active { transform: scale(0.98); }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* ── DIVIDER ── */
    .card-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 28px 0 16px;
    }

    /* ── FOOTER TEXT ── */
    .login-footer {
      text-align: center;
      font-size: 12px;
      color: var(--ink-light);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .login-card {
        padding: 32px 22px 28px;
        border-radius: 18px;
      }
      .brand-name { font-size: 22px; }
      .login-heading { font-size: 19px; }
    }

    @media (max-width: 360px) {
      body { padding: 12px; }
      .login-card { padding: 26px 16px 22px; }
    }
  </style>
</head>
<body>

<div class="login-card">

  <!-- BRAND -->
  <div class="brand">
    <div class="brand-logo-wrap">
      <img src="bismi_logo.jpeg" alt="Bismi" class="brand-logo">
    </div>
    <div class="brand-text">
      <span class="brand-name">Bismi</span>
      <span class="brand-sub">Segar Halal Suci</span>
    </div>
  </div>

  <!-- HEADING -->
  <h2 class="login-heading">Welcome back</h2>
  <p class="login-sub">Sign in to your AccessHub account</p>

  <!-- ERROR -->
  <div id="errorBox" class="error-box hidden">
    <i class="fas fa-circle-exclamation"></i>
    <span id="errorMsg"></span>
  </div>

  <!-- EMAIL -->
  <div class="form-group">
    <label class="form-label">Email Address</label>
    <div class="input-wrap">
      <span class="input-icon"><i class="fas fa-envelope"></i></span>
      <input id="email" type="email" placeholder="Enter your email" autocomplete="email">
    </div>
  </div>

  <!-- PASSWORD -->
  <div class="form-group">
    <label class="form-label">Password</label>
    <div class="input-wrap">
      <span class="input-icon"><i class="fas fa-lock"></i></span>
      <input id="password" type="password" placeholder="Enter your password"
             autocomplete="current-password" onfocus="checkEmailFirst()">
      <button class="toggle-pw" type="button" onclick="togglePassword()" tabindex="-1">
        <i class="fas fa-eye" id="pwEyeIcon"></i>
      </button>
    </div>
  </div>

  <!-- REMEMBER ME -->
  <div class="remember-row">
    <input type="checkbox" id="rememberMe">
    <label for="rememberMe">Keep me signed in</label>
  </div>

  <!-- BUTTON -->
  <button class="login-btn" id="loginBtn" onclick="login()">
    <i class="fas fa-arrow-right-to-bracket"></i> Sign In
  </button>

  <hr class="card-divider">

  <p class="login-footer">Bismi AccessHub &copy; 2026 · All rights reserved</p>

</div>

<script>
  function showError(message) {
    const box = document.getElementById("errorBox");
    document.getElementById("errorMsg").textContent = message;
    box.classList.remove("hidden");
  }

  function hideError() {
    document.getElementById("errorBox").classList.add("hidden");
  }

  function togglePassword() {
    const input = document.getElementById("password");
    const icon  = document.getElementById("pwEyeIcon");
    if (input.type === "password") {
      input.type = "text";
      icon.className = "fas fa-eye-slash";
    } else {
      input.type = "password";
      icon.className = "fas fa-eye";
    }
  }

  function checkEmailFirst() {
    const email = document.getElementById("email").value.trim();
    if (!email) {
      showError("Please enter your email first");
      document.getElementById("email").focus();
      return false;
    }
    return true;
  }

  async function login() {
    hideError();
    const email    = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const remember = document.getElementById("rememberMe").checked;
    const btn      = document.getElementById("loginBtn");

    if (!email)    { showError("Email is required"); return; }
    if (!password) { showError("Password is required"); return; }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

    try {
      const res  = await fetch(`${API}/api/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (!data.token) {
        showError(data.message || "Incorrect email or password");
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Sign In';
        return;
      }

      const store = remember ? localStorage : sessionStorage;
      store.setItem("token", data.token);
      store.setItem("user",  JSON.stringify(data.user));
      store.setItem("role",  data.user.role);

      if (data.user.role === "admin" || data.user.role === "superadmin") {
        window.location.href = "admin.html";
      } else {
        window.location.href = "index.html";
      }

    } catch(err) {
      console.error(err);
      showError("Server error. Please try again.");
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Sign In';
    }
  }

  /* Keyboard navigation */
  document.getElementById("email").addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      if (checkEmailFirst()) document.getElementById("password").focus();
    }
  });

  document.getElementById("password").addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      login();
    }
  });

  /* Hide error on typing */
  document.getElementById("email").addEventListener("input",    hideError);
  document.getElementById("password").addEventListener("input", hideError);
</script>

</body>
</html>
