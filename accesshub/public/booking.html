  <h2>AccessHub</h2>

  <button>
    All
  </button>

  <button>
    HRAISC
  </button>

  <button>
    Finance & Account
  </button>

    Logistics & Maintenance
  </button>

  <button class="active">
    <i class="fa-solid fa-door-open"></i>
    Room Booking
  </button>

<!-- MAIN -->
<div class="main">

  <div class="page-header">
    <h2>Room Booking</h2>
    <p>Book a meeting room for your event or discussion.</p>
  </div>

  <!-- TABS -->
  <div class="tabs">

    <button
      class="tab-btn active"
      onclick="showTab('bookTab', this)"
    >
      <i class="fa-solid fa-plus"></i>
      New Booking
    </button>

    <button
      class="tab-btn"
      onclick="showTab('myBookingsTab', this); loadMyBookings()"
    >
      <i class="fa-solid fa-list"></i>
      My Bookings
    </button>

  </div>

  <!-- ========================= -->
  <!-- TAB: NEW BOOKING -->
  <!-- ========================= -->

  <div id="bookTab">

    <div class="card">

      <h3>
        <i
          class="fa-solid fa-calendar-plus"
          style="color:#3b82f6;margin-right:8px;"
        ></i>

        Booking Form
      </h3>

      <div class="form-grid">

        <!-- Room Type -->
        <div class="form-group full">

          <label>
            Room Type <span class="required">*</span>
          </label>

          <select
            id="roomSelect"
            onchange="onRoomOrDateChange()"
          >

            <option value="">
              -- Select Room --
            </option>

            <option value="1">
              Meeting Room Pejabat Urusan
            </option>

            <option value="2">
              Meeting Room Director
            </option>

            <option value="3">
              The Nest
            </option>

          </select>

        </div>

        <!-- Event Name -->
        <div class="form-group full">

          <label>
            Event Name <span class="required">*</span>
          </label>

          <input
            type="text"
            id="eventName"
            placeholder="e.g. Q3 Planning Meeting"
          >

        </div>

        <!-- Date -->
        <div class="form-group">

          <label>
            Date <span class="required">*</span>
          </label>

          <input
            type="date"
            id="bookingDate"
            onchange="onRoomOrDateChange()"
          >

        </div>

        <!-- Start Time -->
        <div class="form-group">

          <label>
            Start Time <span class="required">*</span>
          </label>

          <select
            id="startTime"
            onchange="updateEndTime()"
          >

            <option value="">
              -- Select Time --
            </option>

          </select>

        </div>

        <!-- Duration -->
        <div class="form-group">

          <label>
            Duration <span class="required">*</span>
          </label>

          <div class="duration-row">

            <select
              id="durationHours"
              onchange="updateEndTime()"
            >
              <option value="0">0 hr</option>
              <option value="1">1 hr</option>
              <option value="2">2 hr</option>
              <option value="3">3 hr</option>
              <option value="4">4 hr</option>
            </select>

            <select
              id="durationMins"
              onchange="updateEndTime()"
            >
              <option value="0">0 min</option>
              <option value="30">30 min</option>
            </select>

          </div>

        </div>

        <!-- End Time -->
        <div class="form-group">

          <label>
            End Time
          </label>

          <input
            type="text"
            id="endTime"
            placeholder="Auto-calculated"
            readonly
          >

        </div>

        <!-- Booked slots -->
        <div class="form-group full">
          <div class="slots-info" id="slotsInfo"></div>
        </div>

        <!-- Full Name -->
        <div class="form-group">

          <label>
            Full Name <span class="required">*</span>
          </label>

          <input
            type="text"
            id="bookerName"
            placeholder="Your full name"
          >

        </div>

        <!-- Department -->
        <div class="form-group">

          <label>
            Department <span class="required">*</span>
          </label>

          <select id="bookerDept">

            <option value="">
              -- Select Department --
            </option>

            <option>PJU</option>
            <option>Farm - Development</option>
            <option>Factory</option>
            <option>BEET</option>
            <option>ABF</option>
            <option>Marketing</option>
            <option>HRAISC</option>
            <option>Farm - Flock Health</option>
            <option>Farm - Technical</option>
            <option>Fresh Frozen Chicken (FFC)</option>
            <option>Farm - Planning</option>
            <option>Naka Biolife</option>
            <option>Sales</option>
            <option>Logistic</option>
            <option>Outlet Operation</option>
            <option>Finance And Account</option>
            <option>M & F</option>
            <option>Business Development & IT</option>
            <option>QC</option>

          </select>

        </div>

        <!-- Phone -->
        <div class="form-group">

          <label>
            Phone Number <span class="required">*</span>
          </label>

          <input
            type="tel"
            id="bookerPhone"
            placeholder="e.g. 0123456789"
          >

        </div>

      </div>

      <button
        class="btn-submit"
        onclick="submitBooking()"
      >
        <i class="fa-solid fa-paper-plane"></i>
        Submit Booking
      </button>

    </div>

  </div>

  <!-- ========================= -->
  <!-- TAB: MY BOOKINGS -->
  <!-- ========================= -->

  <div
    id="myBookingsTab"
    style="display:none;"
  >

    <div class="card">

      <h3>
        <i
          class="fa-solid fa-list"
          style="color:#3b82f6;margin-right:8px;"
        ></i>

        My Bookings
      </h3>

      <div class="table-container">

        <table id="myBookingsTable">

          <thead>
            <tr>
              <th>Room</th>
              <th>Event</th>
              <th>Date</th>
              <th>Time</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody></tbody>

        </table>

      </div>

    </div>

  </div>

</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>
