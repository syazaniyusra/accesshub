<style>

/* ========================= */
/* TOP ACTION BUTTONS */
/* ========================= */

.top-actions {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
}

.tab-btn {
  border: none;
  padding: 12px 18px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  background: #e2e8f0;
  color: #1e293b;
  transition: 0.2s;

  display: flex;
  align-items: center;
  gap: 8px;
}

.tab-btn.active {
  background: #3b82f6;
  color: white;
}

.tab-btn:hover {
  opacity: 0.9;
}

/* ========================= */
/* FORM */
/* ========================= */

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-group.full {
  grid-column: 1 / -1;
}

.form-group label {
  font-size: 13px;
  font-weight: 600;
  color: #374151;
}

.form-group label span.required {
  color: #ef4444;
  margin-left: 2px;
}

/* ========================= */
/* INPUT + SELECT */
/* ========================= */

.form-group input,
.form-group select {

  width: 100%;
  padding: 10px 14px;

  border: 1.5px solid #e2e8f0;
  border-radius: 8px;

  font-size: 14px;
  color: #1e293b;

  background: #f8fafc;

  transition: border 0.2s;
  outline: none;
}

/* ========================= */
/* SELECT */
/* ========================= */

.form-group select {
  cursor: pointer;
}

/* ========================= */
/* FOCUS */
/* ========================= */

.form-group input:focus,
.form-group select:focus {
  border-color: #3b82f6;
  background: white;
}

/* ========================= */
/* READ ONLY */
/* ========================= */

.form-group input:read-only {
  background: #f1f5f9;
  color: #64748b;
  cursor: not-allowed;
}

/* ========================= */
/* DURATION */
/* ========================= */

.duration-row {
  display: flex;
  gap: 10px;
}

.duration-row select {
  flex: 1;
}

/* ========================= */
/* HISTORY */
/* ========================= */

.history-card {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  padding: 16px;
  border-radius: 10px;
  margin-bottom: 14px;
}

.history-card h4 {
  margin: 0 0 10px;
}

.history-card p {
  margin: 6px 0;
  color: #475569;
}

.empty {
  text-align: center;
  color: #64748b;
  padding: 20px;
}

</style>

<!-- ========================= -->
<!-- TOP BUTTONS -->
<!-- ========================= -->

<div class="top-actions">

  <button
    class="tab-btn active"
    id="newBookingBtn"
    onclick="showBookingForm()"
  >
    <i class="fas fa-plus"></i>
    New Booking
  </button>

  <button
    class="tab-btn"
    id="historyBtn"
    onclick="showBookingHistory()"
  >
    <i class="fas fa-list"></i>
    My Bookings
  </button>

</div>

<!-- ========================= -->
<!-- BOOKING FORM -->
<!-- ========================= -->

<div id="bookingFormSection">

<div class="form-grid">

  <!-- Room Type -->
  <div class="form-group full">

    <label>
      Room Type <span class="required">*</span>
    </label>

    <select id="roomSelect" onchange="onRoomOrDateChange()">

      <option value="">
        -- Select Room --
      </option>

      <option value="1">
        Meeting Room Pejabat Urusan
      </option>

      <option value="2">
        Meeting Room Director
      </option>

      <option value="3">
        The Nest
      </option>

    </select>

  </div>

  <!-- Event Name -->
  <div class="form-group full">

    <label>
      Event Name <span class="required">*</span>
    </label>

    <input
      type="text"
      id="eventName"
      placeholder="e.g. Q3 Planning Meeting"
    >

  </div>

  <!-- Date -->
  <div class="form-group">

    <label>
      Date <span class="required">*</span>
    </label>

    <input
      type="date"
      id="bookingDate"
      onchange="onRoomOrDateChange()"
    >

  </div>

  <!-- Start Time -->
  <div class="form-group">

    <label>
      Start Time <span class="required">*</span>
    </label>

    <select id="startTime" onchange="updateEndTime()">

      <option value="">
        -- Select Time --
      </option>

    </select>

  </div>

  <!-- Duration -->
  <div class="form-group">

    <label>
      Duration <span class="required">*</span>
    </label>

    <div class="duration-row">

      <select id="durationHours" onchange="updateEndTime()">
        <option value="0">0 hr</option>
        <option value="1">1 hr</option>
        <option value="2">2 hr</option>
        <option value="3">3 hr</option>
        <option value="4">4 hr</option>
      </select>

      <select id="durationMins" onchange="updateEndTime()">
        <option value="0">0 min</option>
        <option value="30">30 min</option>
      </select>

    </div>

  </div>

  <!-- End Time -->
  <div class="form-group">

    <label>
      End Time
    </label>

    <input
      type="text"
      id="endTime"
      placeholder="Auto-calculated"
      readonly
    >

  </div>

  <!-- Booked Slots -->
  <div class="form-group full">
    <div class="slots-info" id="slotsInfo"></div>
  </div>

  <!-- Full Name -->
  <div class="form-group">

    <label>
      Full Name <span class="required">*</span>
    </label>

    <input
      type="text"
      id="bookerName"
      placeholder="Your full name"
    >

  </div>

  <!-- Department -->
  <div class="form-group">

    <label>
      Department <span class="required">*</span>
    </label>

    <select id="bookerDept">

      <option value="">
        -- Select Department --
      </option>

      <option>PJU</option>
      <option>Farm - Development</option>
      <option>Factory</option>
      <option>BEET</option>
      <option>ABF</option>
      <option>Marketing</option>
      <option>HRAISC</option>
      <option>Farm - Flock Health</option>
      <option>Farm - Technical</option>
      <option>Fresh Frozen Chicken (FFC)</option>
      <option>Farm - Planning</option>
      <option>Naka Biolife</option>
      <option>Sales</option>
      <option>Logistic</option>
      <option>Outlet Operation</option>
      <option>Finance And Account</option>
      <option>M & F</option>
      <option>Business Development & IT</option>
      <option>QC</option>

    </select>

  </div>

  <!-- Phone Number -->
  <div class="form-group">

    <label>
      Phone Number <span class="required">*</span>
    </label>

    <input
      type="tel"
      id="bookerPhone"
      placeholder="e.g. 0123456789"
    >

  </div>

</div>

</div>

<!-- ========================= -->
<!-- BOOKING HISTORY -->
<!-- ========================= -->

<div id="bookingHistorySection" style="display:none;">

  <div class="history-card">

    <h3 style="margin-bottom:20px;">
      My Booking History
    </h3>

    <div id="bookingHistoryList">

      <div class="empty">
        No booking history found
      </div>

    </div>

  </div>

</div>

<!-- ========================= -->
<!-- SCRIPT -->
<!-- ========================= -->

<script>

function showBookingForm() {

  document.getElementById("bookingFormSection")
    .style.display = "block";

  document.getElementById("bookingHistorySection")
    .style.display = "none";

  document.getElementById("newBookingBtn")
    .classList.add("active");

  document.getElementById("historyBtn")
    .classList.remove("active");
}

function showBookingHistory() {

  document.getElementById("bookingFormSection")
    .style.display = "none";

  document.getElementById("bookingHistorySection")
    .style.display = "block";

  document.getElementById("historyBtn")
    .classList.add("active");

  document.getElementById("newBookingBtn")
    .classList.remove("active");

  loadBookingHistory();
}

async function loadBookingHistory() {

  const historyContainer =
    document.getElementById("bookingHistoryList");

  historyContainer.innerHTML = `
    <div class="empty">
      Loading booking history...
    </div>
  `;

  try {

    const userData =
      localStorage.getItem("user") ||
      sessionStorage.getItem("user");

    const user = JSON.parse(userData);

    const res =
      await fetch(`${API}/api/bookings/user/${user.id}`);

    const bookings = await res.json();

    if (!Array.isArray(bookings) || bookings.length === 0) {

      historyContainer.innerHTML = `
        <div class="empty">
          No booking history found
        </div>
      `;

      return;
    }

    historyContainer.innerHTML = "";

    bookings.forEach(item => {

      historyContainer.innerHTML += `

        <div class="history-card">

          <h4>${item.event_name}</h4>

          <p>
            <strong>Room:</strong>
            ${item.room_name}
          </p>

          <p>
            <strong>Date:</strong>
            ${item.booking_date}
          </p>

          <p>
            <strong>Time:</strong>
            ${item.start_time} - ${item.end_time}
          </p>

        </div>

      `;
    });

  } catch (err) {

    console.error(err);

    historyContainer.innerHTML = `
      <div class="empty">
        Failed to load booking history
      </div>
    `;
  }
}

</script>
