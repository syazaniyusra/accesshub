<style>

/* ========================= */
/* TOP ACTION BUTTONS */
/* ========================= */

.top-actions {

<script>

/* ---------- TAB SWITCHING ---------- */

function showSection(s) {
  document.getElementById('sectionForm').classList.toggle('active', s === 'form');
  document.getElementById('sectionHistory').classList.toggle('active', s === 'history');
  document.getElementById('newBookingBtn').classList.toggle('active', s === 'form');
  document.getElementById('historyBtn').classList.toggle('active', s === 'history');
  if (s === 'history') {
    loadMyBookings();
    loadRoomSchedule();
  }
}

function switchInner(t) {
  document.getElementById('innerMine').classList.toggle('active', t === 'mine');
  document.getElementById('innerRoom').classList.toggle('active', t === 'room');
  document.getElementById('tabMine').classList.toggle('active', t === 'mine');
  document.getElementById('tabRoom').classList.toggle('active', t === 'room');
}

/* ---------- FORM LOGIC ---------- */

function onFieldChange() {
  const room = document.getElementById('roomSelect').value;
  const date = document.getElementById('bookingDate').value;
  const ready = room && date;

  document.getElementById('checkBtn').disabled = !ready;
  document.getElementById('checkHint').style.display = ready ? 'none' : 'flex';
  document.getElementById('startHint').style.display = ready ? 'flex' : 'none';

  if (!ready) {
    document.getElementById('availabilityGrid').style.display = 'none';
    document.getElementById('availLegend').style.display = 'none';
  }
}

function updateEndTime() {
  const start = document.getElementById('startTime').value;
  const hrs   = parseInt(document.getElementById('durationHours').value)  || 0;
  const mins  = parseInt(document.getElementById('durationMins').value)   || 0;

  if (!start || (hrs === 0 && mins === 0)) {
    document.getElementById('endTime').value = '';
    return;
  }

  const [h, m] = start.split(':').map(Number);
  const total  = h * 60 + m + hrs * 60 + mins;
  const eh     = Math.floor(total / 60) % 24;
  const em     = total % 60;
  const ap     = eh >= 12 ? 'PM' : 'AM';
  const dh     = eh > 12 ? eh - 12 : (eh === 0 ? 12 : eh);

  document.getElementById('endTime').value =
    `${dh}:${String(em).padStart(2, '0')} ${ap}`;
}

async function checkAvailability() {
  const room = document.getElementById('roomSelect').value;
  const date = document.getElementById('bookingDate').value;

  if (!room || !date) {
    showToast('Please select room and date first', 'error');
    return;
  }

  const grid   = document.getElementById('availabilityGrid');
  const legend = document.getElementById('availLegend');
  const btnTxt = document.getElementById('checkBtnText');

  grid.innerHTML   = '';
  grid.style.display   = 'grid';
  legend.style.display = 'none';
  btnTxt.textContent   = 'Checking...';

  /* show a loading skeleton row */
  grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:14px;color:#94a3b8;font-size:13px;">
    <i class="fas fa-spinner fa-spin"></i> Loading slots...
  </div>`;

  let bookedTimes = [];

  try {
    const res = await fetch(`${API}/api/bookings/slots?room_id=${room}&date=${date}`);
    if (res.ok) {
      const booked = await res.json();
      bookedTimes  = Array.isArray(booked)
        ? booked.map(b => (b.start_time || '').slice(0, 5)).filter(Boolean)
        : [];
    }
  } catch (err) {
    console.error('checkAvailability error:', err);
    /* still render grid — just treat all slots as available */
  } finally {
    btnTxt.textContent = 'Check Live Availability';
  }

  renderSlots(grid, legend, bookedTimes);
}

function renderSlots(grid, legend, bookedTimes) {
  const slots = [
    '08:00','09:00','10:00','11:00',
    '12:00','13:00','14:00','15:00',
    '16:00','17:00','18:00','19:00',
    '20:00','21:00','22:00','23:00'
  ];

  grid.innerHTML = '';
  grid.style.display  = 'grid';
  legend.style.display = 'flex';

  slots.forEach(time => {
    const btn = document.createElement('button');
    btn.innerText  = time;
    btn.type       = 'button';
    btn.classList.add('time-slot-btn');

    if (bookedTimes.includes(time)) {
      btn.classList.add('booked');
      btn.disabled = true;
    } else {
      btn.classList.add('available');
      btn.onclick = () => {
        document.querySelectorAll('.time-slot-btn')
          .forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        document.getElementById('startTime').value = time;
        updateEndTime();
      };
    }

    grid.appendChild(btn);
  });
}

async function submitBooking() {
  const room  = document.getElementById('roomSelect').value;
  const date  = document.getElementById('bookingDate').value;
  const start = document.getElementById('startTime').value;
  const hrs   = document.getElementById('durationHours').value;
  const mins  = document.getElementById('durationMins').value;
  const event = document.getElementById('eventName').value.trim();
  const name  = document.getElementById('bookerName').value.trim();
  const dept  = document.getElementById('bookerDept').value;
  const phone = document.getElementById('bookerPhone').value.trim();

  if (!room || !date || !start || (!hrs && !mins) || !event || !name || !dept || !phone) {
    showToast('Please fill in all required fields', 'error');
    return;
  }

  try {
    const userData = localStorage.getItem('user') || sessionStorage.getItem('user');
    const user = JSON.parse(userData);

    const res = await fetch(`${API}/api/bookings`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        user_id:      user.id,
        room_id:      room,
        booking_date: date,
        start_time:   start,
        duration_hrs: hrs,
        duration_mins: mins,
        event_name:   event,
        booker_name:  name,
        department:   dept,
        phone:        phone
      })
    });

    if (res.ok) {
      showToast('Booking confirmed!', 'success');
      resetForm();
    } else {
      showToast('Booking failed. Please try again.', 'error');
    }

  } catch (err) {
    console.error(err);
    showToast('Something went wrong.', 'error');
  }
}

function resetForm() {
  ['roomSelect','startTime','durationHours','durationMins','bookerDept'].forEach(id => {
    document.getElementById(id).selectedIndex = 0;
  });
  ['bookingDate','eventName','bookerName','bookerPhone','endTime'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('availabilityGrid').style.display = 'none';
  document.getElementById('availLegend').style.display      = 'none';
  document.getElementById('checkHint').style.display        = 'flex';
  document.getElementById('startHint').style.display        = 'none';
  document.getElementById('checkBtn').disabled              = true;
}

/* ---------- AVATAR COLOR HELPER ---------- */

const avatarPalette = [
  { color:'#dbeafe', textColor:'#1e40af' },
  { color:'#fce7f3', textColor:'#9d174d' },
  { color:'#d1fae5', textColor:'#065f46' },
  { color:'#fef3c7', textColor:'#92400e' },
  { color:'#ede9fe', textColor:'#5b21b6' },
  { color:'#fee2e2', textColor:'#991b1b' },
  { color:'#ecfdf5', textColor:'#064e3b' },
  { color:'#fff7ed', textColor:'#9a3412' },
];

function getAvatarStyle(name) {
  const idx = (name || '').split('').reduce((acc, c) => acc + c.charCodeAt(0), 0) % avatarPalette.length;
  return avatarPalette[idx];
}

function getInitials(name) {
  if (!name) return '?';
  const parts = name.trim().split(' ');
  return parts.length >= 2
    ? (parts[0][0] + parts[1][0]).toUpperCase()
    : parts[0].slice(0, 2).toUpperCase();
}

function getBookingStatus(dateStr) {
  const today    = new Date(); today.setHours(0,0,0,0);
  const bookDate = new Date(dateStr);
  return bookDate >= today ? 'upcoming' : 'completed';
}

/* ---------- MY BOOKINGS ---------- */

let myFilter   = 'all';
let myData     = [];

async function loadMyBookings() {
  const list = document.getElementById('myList');
  list.innerHTML = `<div class="hist-empty"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div>`;

  try {
    const userData = localStorage.getItem('user') || sessionStorage.getItem('user');
    const user     = JSON.parse(userData);

    const res  = await fetch(`${API}/api/bookings/user/${user.id}`);
    const data = await res.json();

    myData = Array.isArray(data) ? data.map(b => ({
      id:     b.id,
      event:  b.event_name,
      room:   b.room_name,
      date:   b.booking_date,
      start:  b.start_time ? b.start_time.slice(0,5) : '',
      end:    b.end_time   ? b.end_time.slice(0,5)   : '',
      dept:   b.department,
      status: b.status || getBookingStatus(b.booking_date),
    })) : [];

  } catch (err) {
    console.error('loadMyBookings error:', err);
    myData = [];
  }

  renderMine();
}

function setMyFilter(f, el) {
  myFilter = f;
  document.querySelectorAll('#innerMine .filter-btn')
    .forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderMine();
}

function renderMine() {
  const search   = (document.getElementById('mySearch').value || '').toLowerCase();
  const filtered = myData.filter(b => {
    const mf = myFilter === 'all' || b.status === myFilter;
    const ms = !search
      || b.event.toLowerCase().includes(search)
      || b.room.toLowerCase().includes(search);
    return mf && ms;
  });

  document.getElementById('myTotal').textContent     = myData.length;
  document.getElementById('myUpcoming').textContent  = myData.filter(b => b.status === 'upcoming').length;
  document.getElementById('myCompleted').textContent = myData.filter(b => b.status === 'completed').length;

  const list = document.getElementById('myList');

  if (!filtered.length) {
    list.innerHTML = `<div class="hist-empty"><i class="fas fa-calendar-times"></i><p>No bookings found</p></div>`;
    return;
  }

  list.innerHTML = filtered.map(b => {
    const d   = new Date(b.date);
    const day = d.getDate();
    const mon = d.toLocaleDateString('en', { month: 'short' });
    const bc  = b.status === 'upcoming'  ? 'badge-upcoming'
              : b.status === 'completed' ? 'badge-completed'
              : 'badge-cancelled';
    const bl  = b.status.charAt(0).toUpperCase() + b.status.slice(1);
    return `
      <div class="booking-card">
        <div class="date-block">
          <div class="date-day">${day}</div>
          <div class="date-mon">${mon}</div>
        </div>
        <div class="booking-info">
          <div class="booking-title">${b.event}</div>
          <div class="booking-meta">
            <span class="meta-item"><i class="fas fa-door-open"></i> ${b.room}</span>
            <span class="meta-item"><i class="fas fa-clock"></i> ${b.start} – ${b.end}</span>
            <span class="meta-item"><i class="fas fa-building"></i> ${b.dept}</span>
          </div>
        </div>
        <span class="status-badge ${bc}">${bl}</span>
      </div>`;
  }).join('');
}

/* ---------- ROOM SCHEDULE ---------- */

const roomsList = ['All rooms', 'Meeting Room Pejabat Urusan', 'Meeting Room Director', 'The Nest'];
let roomFilter  = 'All rooms';
let roomData    = [];

async function loadRoomSchedule() {
  const list = document.getElementById('roomList');
  list.innerHTML = `<div class="hist-empty"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div>`;

  try {
    const res  = await fetch(`${API}/api/bookings/all`);
    const data = await res.json();

    roomData = Array.isArray(data) ? data.map(b => ({
      id:     b.id,
      event:  b.event_name,
      room:   b.room_name,
      date:   b.booking_date,
      start:  b.start_time ? b.start_time.slice(0,5) : '',
      end:    b.end_time   ? b.end_time.slice(0,5)   : '',
      booker: b.booker_name || b.full_name || 'Unknown',
      dept:   b.department,
    })) : [];

  } catch (err) {
    console.error('loadRoomSchedule error:', err);
    roomData = [];
  }

  buildRoomPills();
  renderRoom();
}

function buildRoomPills() {
  document.getElementById('roomPills').innerHTML = roomsList.map(r =>
    `<button class="room-pill${r === roomFilter ? ' active' : ''}" onclick="setRoomFilter('${r}', this)">${r}</button>`
  ).join('');
}

function setRoomFilter(f, el) {
  roomFilter = f;
  document.querySelectorAll('.room-pill').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderRoom();
}

function renderRoom() {
  const search   = (document.getElementById('roomSearch').value || '').toLowerCase();
  const filtered = roomData.filter(b => {
    const rf = roomFilter === 'All rooms' || b.room === roomFilter;
    const rs = !search
      || b.event.toLowerCase().includes(search)
      || (b.booker || '').toLowerCase().includes(search)
      || (b.dept  || '').toLowerCase().includes(search);
    return rf && rs;
  });

  const list = document.getElementById('roomList');

  if (!filtered.length) {
    list.innerHTML = `<div class="hist-empty"><i class="fas fa-calendar-times"></i><p>No bookings found</p></div>`;
    return;
  }

  list.innerHTML = filtered.map(b => {
    const d        = new Date(b.date);
    const day      = d.getDate();
    const mon      = d.toLocaleDateString('en', { month: 'short' });
    const av       = getAvatarStyle(b.booker);
    const initials = getInitials(b.booker);
    const firstName = (b.booker || 'Unknown').split(' ')[0];
    return `
      <div class="booking-card">
        <div class="date-block">
          <div class="date-day">${day}</div>
          <div class="date-mon">${mon}</div>
        </div>
        <div class="booking-info">
          <div class="booking-title">${b.event}</div>
          <div class="booking-meta">
            <span class="meta-item"><i class="fas fa-door-open"></i> ${b.room}</span>
            <span class="meta-item"><i class="fas fa-clock"></i> ${b.start} – ${b.end}</span>
            <span class="meta-item"><i class="fas fa-building"></i> ${b.dept}</span>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0">
          <div class="booker-avatar" style="background:${av.color};color:${av.textColor}">${initials}</div>
          <span style="font-size:11px;color:#94a3b8;white-space:nowrap">${firstName}</span>
        </div>
      </div>`;
  }).join('');
}
