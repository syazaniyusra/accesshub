<script>

/* ---- AUTO-FILL from session ---- */
(function prefillUser() {
  try {
    const userData = localStorage.getItem('user') || sessionStorage.getItem('user');
    if (!userData) return;
    const user = JSON.parse(userData);

    // Full name
    if (user.name) {
      const nameEl = document.getElementById('bookerName');
      if (nameEl) nameEl.value = user.name;
    }

    // Department — match against work department
    if (window.userDepartments?.length) {
      const deptName = window.userDepartments[0]?.name || '';
      const deptEl   = document.getElementById('bookerDept');
      if (deptEl && deptName) {
        const opt = Array.from(deptEl.options).find(o =>
          o.value.toLowerCase() === deptName.toLowerCase()
        );
        if (opt) deptEl.value = opt.value;
      }
    }
  } catch(e) { console.error('prefillUser:', e); }
})();

/* ---- SHARED SLOTS ---- */
const ALL_SLOTS = [
  '08:00','09:00','10:00','11:00',
  '12:00','13:00','14:00','15:00',
  '16:00','17:00','18:00','19:00',
  '20:00','21:00','22:00','23:00'
];

/* ---- TABS ---- */
function showSection(s) {
  document.getElementById('sectionForm').classList.toggle('active', s === 'form');
  document.getElementById('sectionHistory').classList.toggle('active', s === 'history');
  document.getElementById('newBookingBtn').classList.toggle('active', s === 'form');
  document.getElementById('historyBtn').classList.toggle('active', s === 'history');
  if (s === 'history') { loadMyBookings(); loadRoomSchedule(); }
}

function switchInner(t) {
  document.getElementById('innerMine').classList.toggle('active', t === 'mine');
  document.getElementById('innerRoom').classList.toggle('active', t === 'room');
  document.getElementById('tabMine').classList.toggle('active', t === 'mine');
  document.getElementById('tabRoom').classList.toggle('active', t === 'room');
}

/* ---- FIELD CHANGE ---- */
function onFieldChange() {
  const room  = document.getElementById('roomSelect').value;
  const date  = document.getElementById('bookingDate').value;
  const ready = !!(room && date);
  document.getElementById('checkBtn').disabled       = !ready;
  document.getElementById('checkHint').style.display = ready ? 'none' : 'flex';
  document.getElementById('startHint').style.display = ready ? 'flex'  : 'none';
  if (!ready) {
    document.getElementById('availabilityGrid').style.display = 'none';
    document.getElementById('availLegend').style.display      = 'none';
  }
}

/* ---- END TIME CALC ---- */
function updateEndTime() {
  const start    = document.getElementById('startTime').value;
  const duration = parseInt(document.getElementById('duration').value) || 0;

  if (!start || !duration) {
    document.getElementById('endTime').value = '';
    highlightSelectedSlots();
    return;
  }

  const [h, m] = start.split(':').map(Number);
  const total  = (h * 60) + m + duration;
  const eh     = Math.floor(total / 60) % 24;
  const em     = total % 60;
  const ap     = eh >= 12 ? 'PM' : 'AM';
  const dh     = eh > 12 ? eh - 12 : (eh === 0 ? 12 : eh);

  document.getElementById('endTime').value =
    `${dh}:${String(em).padStart(2,'0')} ${ap}`;

  highlightSelectedSlots();
}

/* ---- HIGHLIGHT DURATION RANGE ---- */
function highlightSelectedSlots() {
  const startTime   = document.getElementById('startTime').value;
  const totalMins   = parseInt(document.getElementById('duration').value) || 0;
  const bookedTimes = Array.from(
    document.querySelectorAll('.time-slot-btn.booked')
  ).map(b => b.dataset.time);

  document.querySelectorAll('.time-slot-btn:not(.booked)')
    .forEach(b => { b.classList.remove('selected'); b.classList.add('available'); });

  if (!startTime || totalMins === 0) return;

  const [sh, sm]  = startTime.split(':').map(Number);
  const startMins = sh * 60 + sm;
  const endMins   = startMins + totalMins;

  ALL_SLOTS.forEach(slot => {
    const [h, m]    = slot.split(':').map(Number);
    const slotStart = h * 60 + m;
    if (slotStart >= startMins && slotStart < endMins) {
      const btn = document.querySelector(`.time-slot-btn[data-time="${slot}"]`);
      if (btn && !bookedTimes.includes(slot)) {
        btn.classList.remove('available');
        btn.classList.add('selected');
      }
    }
  });
}

/* ---- CHECK AVAILABILITY ---- */
async function checkAvailability() {
  const room = document.getElementById('roomSelect').value;
  const date = document.getElementById('bookingDate').value;
  if (!room || !date) return;

  const grid   = document.getElementById('availabilityGrid');
  const legend = document.getElementById('availLegend');
  const btnTxt = document.getElementById('checkBtnText');

  grid.style.display   = 'grid';
  legend.style.display = 'none';
  btnTxt.textContent   = 'Checking...';
  grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:14px;color:var(--ink-light);font-size:13px;">
    <i class="fas fa-spinner fa-spin" style="color:var(--pink)"></i> Loading slots...
  </div>`;

  let bookedTimes = [];
  try {
    const res = await fetch(`${API}/api/bookings/slots?room_id=${room}&date=${date}`);
    if (res.ok) {
      const data = await res.json();
      bookedTimes = Array.isArray(data)
        ? data.map(b => (b.start_time || '').slice(0,5)).filter(Boolean)
        : [];
    }
  } catch (e) {
    console.error('checkAvailability:', e);
  } finally {
    btnTxt.textContent = 'Check Live Availability';
  }

  renderSlots(grid, legend, bookedTimes);
}

function renderSlots(grid, legend, bookedTimes) {
  grid.innerHTML       = '';
  grid.style.display   = 'grid';
  legend.style.display = 'flex';

  ALL_SLOTS.forEach(time => {
    const btn        = document.createElement('button');
    btn.innerText    = time;
    btn.type         = 'button';
    btn.dataset.time = time;
    btn.classList.add('time-slot-btn');

    if (bookedTimes.includes(time)) {
      btn.classList.add('booked');
      btn.disabled = true;
    } else {
      btn.classList.add('available');
      btn.onclick = () => {
        document.getElementById('startTime').value = time;
        updateEndTime();
      };
    }
    grid.appendChild(btn);
  });

  highlightSelectedSlots();
}

/* ---- SUBMIT ---- */
async function submitBooking() {
  const room     = document.getElementById('roomSelect').value;
  const date     = document.getElementById('bookingDate').value;
  const start    = document.getElementById('startTime').value;
  const duration = document.getElementById('duration').value;
  const event    = document.getElementById('eventName').value.trim();
  const name     = document.getElementById('bookerName').value.trim();
  const dept     = document.getElementById('bookerDept').value;
  const phone    = document.getElementById('bookerPhone').value.trim();

  if (!room || !date || !start || !duration || !event || !name || !dept || !phone) {
    _toast('Please fill in all required fields', 'error');
    return;
  }

  if (phone.length < 7) {
    _toast('Please enter a valid phone number (min 7 digits)', 'error');
    return;
  }

  try {
    const userData = localStorage.getItem('user') || sessionStorage.getItem('user');
    if (!userData) throw new Error('No user session');
    const user = JSON.parse(userData);

    const res = await fetch(`${API}/api/bookings`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        user_id:       user.id,
        room_id:       room,
        booking_date:  date,
        start_time:    start,
        duration_mins: duration,
        event_name:    event,
        booker_name:   name,
        department:    dept,
        phone:         phone
      })
    });

    if (res.ok) {
      _toast('✅ Booking confirmed!', 'success');
      resetForm();
    } else {
      const err = await res.json().catch(() => ({}));
      if (res.status === 409) {
        _toast('⚠️ Room not available for this time slot. Please choose another time.', 'error');
      } else {
        _toast(err.error || err.message || 'Booking failed. Please try again.', 'error');
      }
    }
  } catch (e) {
    console.error('submitBooking:', e);
    _toast('Something went wrong: ' + e.message, 'error');
  }
}

function _toast(msg, type) {
  if (typeof showToast === 'function') showToast(msg, type);
  else alert(msg);
}

function resetForm() {
  ['roomSelect','startTime','duration','bookerDept'].forEach(id =>
    document.getElementById(id).selectedIndex = 0
  );
  ['bookingDate','eventName','bookerPhone','endTime'].forEach(id =>
    document.getElementById(id).value = ''
  );
  // Re-prefill name after reset
  try {
    const userData = localStorage.getItem('user') || sessionStorage.getItem('user');
    if (userData) {
      const user = JSON.parse(userData);
      if (user.name) document.getElementById('bookerName').value = user.name;
    }
  } catch(e) {}
  document.getElementById('availabilityGrid').style.display = 'none';
  document.getElementById('availLegend').style.display      = 'none';
  document.getElementById('checkHint').style.display        = 'flex';
  document.getElementById('startHint').style.display        = 'none';
  document.getElementById('checkBtn').disabled              = true;
}

/* ---- AVATAR HELPERS ---- */
const avatarPalette = [
  { color:'#FCE8F3', textColor:'#D4186C' },
  { color:'#dbeafe', textColor:'#1e40af' },
  { color:'#d1fae5', textColor:'#065f46' },
  { color:'#fef3c7', textColor:'#92400e' },
  { color:'#ede9fe', textColor:'#5b21b6' },
  { color:'#fee2e2', textColor:'#991b1b' },
  { color:'#ecfdf5', textColor:'#064e3b' },
  { color:'#fff7ed', textColor:'#9a3412' },
];

function getAvatarStyle(name) {
  const idx = (name||'').split('').reduce((a,c) => a + c.charCodeAt(0), 0) % avatarPalette.length;
  return avatarPalette[idx];
}

function getInitials(name) {
  if (!name) return '?';
  const p = name.trim().split(' ');
  return p.length >= 2 ? (p[0][0]+p[1][0]).toUpperCase() : p[0].slice(0,2).toUpperCase();
}

/* ---- BOOKING STATUS HELPER ---- */
function getBookingStatus(b) {
  if (b.status === 'cancelled') return 'cancelled';
  const today = new Date(); today.setHours(0,0,0,0);
  return new Date(b.booking_date || b.date) >= today ? 'upcoming' : 'completed';
}

/* ---- MY BOOKINGS ---- */
let myFilter = 'all', myData = [];

async function loadMyBookings() {
  document.getElementById('myList').innerHTML =
    `<div class="hist-empty"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div>`;
  try {
    const u    = JSON.parse(localStorage.getItem('user') || sessionStorage.getItem('user'));
    const data = await fetch(`${API}/api/bookings/user/${u.id}`).then(r => r.json());
    myData = Array.isArray(data) ? data.map(b => ({
      id:     b.id,
      event:  b.event_name,
      room:   b.room_name,
      date:   b.booking_date || b.date,
      start:  (b.start_time||'').slice(0,5),
      end:    (b.end_time||'').slice(0,5),
      dept:   b.department,
      status: getBookingStatus(b),
    })) : [];
  } catch(e) { console.error(e); myData = []; }
  renderMine();
}

function setMyFilter(f, el) {
  myFilter = f;
  document.querySelectorAll('#innerMine .filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderMine();
}

function renderMine() {
  const q = (document.getElementById('mySearch').value||'').toLowerCase();
  const filtered = myData.filter(b =>
    (myFilter === 'all' || b.status === myFilter) &&
    (!q || b.event.toLowerCase().includes(q) || b.room.toLowerCase().includes(q))
  );
  document.getElementById('myTotal').textContent     = myData.length;
  document.getElementById('myUpcoming').textContent  = myData.filter(b=>b.status==='upcoming').length;
  document.getElementById('myCompleted').textContent = myData.filter(b=>b.status==='completed').length;

  const list = document.getElementById('myList');
  if (!filtered.length) {
    list.innerHTML = `<div class="hist-empty"><i class="fas fa-calendar-times"></i><p>No bookings found</p></div>`;
    return;
  }
  list.innerHTML = filtered.map(b => {
    const d  = new Date(b.date);
    const bc = b.status === 'upcoming'  ? 'badge-upcoming'  :
               b.status === 'completed' ? 'badge-completed' : 'badge-cancelled';
    const bl = b.status.charAt(0).toUpperCase() + b.status.slice(1);
    return `<div class="booking-card">
      <div class="date-block">
        <div class="date-day">${d.getDate()}</div>
        <div class="date-mon">${d.toLocaleDateString('en',{month:'short'})}</div>
      </div>
      <div class="booking-info">
        <div class="booking-title">${b.event}</div>
        <div class="booking-meta">
          <span class="meta-item"><i class="fas fa-door-open"></i> ${b.room}</span>
          <span class="meta-item"><i class="fas fa-clock"></i> ${b.start} – ${b.end}</span>
          <span class="meta-item"><i class="fas fa-building"></i> ${b.dept}</span>
        </div>
      </div>
      <span class="status-badge ${bc}">${bl}</span>
    </div>`;
  }).join('');
}

/* ---- ROOM SCHEDULE ---- */
const roomsList = ['All rooms','Meeting Room Pejabat Urusan','Meeting Room Director','The Nest'];
let roomFilter  = 'All rooms', roomData = [];

async function loadRoomSchedule() {
  document.getElementById('roomList').innerHTML =
    `<div class="hist-empty"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div>`;
  try {
    const data = await fetch(`${API}/api/bookings/all`).then(r => r.json());
    roomData = Array.isArray(data) ? data.map(b => ({
      id:     b.id,
      event:  b.event_name,
      room:   b.room_name,
      date:   b.booking_date || b.date,
      start:  (b.start_time||'').slice(0,5),
      end:    (b.end_time||'').slice(0,5),
      booker: b.booker_name || b.name || 'Unknown',
      dept:   b.department,
    })) : [];
  } catch(e) { console.error(e); roomData = []; }
  buildRoomPills(); renderRoom();
}

function buildRoomPills() {
  document.getElementById('roomPills').innerHTML = roomsList.map(r =>
    `<button class="room-pill${r===roomFilter?' active':''}" onclick="setRoomFilter('${r}',this)">${r}</button>`
  ).join('');
}

function setRoomFilter(f, el) {
  roomFilter = f;
  document.querySelectorAll('.room-pill').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderRoom();
}

function renderRoom() {
  const q = (document.getElementById('roomSearch').value||'').toLowerCase();
  const filtered = roomData.filter(b =>
    (roomFilter==='All rooms' || b.room===roomFilter) &&
    (!q || b.event.toLowerCase().includes(q) || (b.booker||'').toLowerCase().includes(q) || (b.dept||'').toLowerCase().includes(q))
  );

  const list = document.getElementById('roomList');
  if (!filtered.length) {
    list.innerHTML = `<div class="hist-empty"><i class="fas fa-calendar-times"></i><p>No bookings found</p></div>`;
    return;
  }
  list.innerHTML = filtered.map(b => {
    const d  = new Date(b.date);
    const av = getAvatarStyle(b.booker);
    return `<div class="booking-card">
      <div class="date-block">
        <div class="date-day">${d.getDate()}</div>
        <div class="date-mon">${d.toLocaleDateString('en',{month:'short'})}</div>
      </div>
      <div class="booking-info">
        <div class="booking-title">${b.event}</div>
        <div class="booking-meta">
          <span class="meta-item"><i class="fas fa-door-open"></i> ${b.room}</span>
          <span class="meta-item"><i class="fas fa-clock"></i> ${b.start} – ${b.end}</span>
          <span class="meta-item"><i class="fas fa-building"></i> ${b.dept}</span>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0">
        <div class="booker-avatar" style="background:${av.color};color:${av.textColor}">${getInitials(b.booker)}</div>
        <span style="font-size:11px;color:var(--ink-light);white-space:nowrap">${(b.booker||'').split(' ')[0]}</span>
      </div>
    </div>`;
  }).join('');
}

/* ---- TITLE CASE ON BLUR ---- */
function toTitleCase(input) {
  input.value = input.value
    .toLowerCase()
    .replace(/\b\w/g, c => c.toUpperCase());
}
