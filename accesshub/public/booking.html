<style>
/* ========================= */
/* FORM */
/* ========================= */

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-group.full {
  grid-column: 1 / -1;
}

.form-group label {
  font-size: 13px;
  font-weight: 600;
  color: #374151;
}

.form-group label span.required {
  color: #ef4444;
  margin-left: 2px;
}

/* ========================= */
/* INPUT + SELECT */
/* ========================= */

.form-group input,
.form-group select {

  width: 100%;
  padding: 10px 14px;

  border: 1.5px solid #e2e8f0;
  border-radius: 8px;

  font-size: 14px;
  color: #1e293b;

  background: #f8fafc;

  transition: border 0.2s;
  outline: none;

  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
}

/* ========================= */
/* SELECT DROPDOWN ARROW */
/* ========================= */

.form-group select {

  background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='20' height='20' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 8 10 12 14 8'/%3E%3C/svg%3E");

  background-repeat: no-repeat;
  background-position: right 12px center;
  background-size: 16px;

  padding-right: 40px;

  cursor: pointer;
}

/* ========================= */
/* FOCUS */
/* ========================= */

.form-group input:focus,
.form-group select:focus {

  border-color: #3b82f6;
  background: white;
}

/* ========================= */
/* READ ONLY */
/* ========================= */

.form-group input:read-only {
  background: #f1f5f9;
  color: #64748b;
  cursor: not-allowed;
}

/* ========================= */
/* DURATION */
/* ========================= */

.duration-row {
  display: flex;
  gap: 10px;
}

.duration-row select {
  flex: 1;
}

</style>
<!-- ========================= -->
<!-- FORM -->
<!-- ========================= -->

<div class="form-grid">

  <!-- Room Type -->
  <div class="form-group full">

    <label>
      Room Type <span class="required">*</span>
    </label>

    <select id="roomSelect" onchange="onRoomOrDateChange()">

      <option value="">
        -- Select Room --
      </option>

      <option value="1">
        Meeting Room Pejabat Urusan
      </option>

      <option value="2">
        Meeting Room Director
      </option>

      <option value="3">
        The Nest
      </option>

    </select>

  </div>

  <!-- Event Name -->
  <div class="form-group full">

    <label>
      Event Name <span class="required">*</span>
    </label>

    <input
      type="text"
      id="eventName"
      placeholder="e.g. Q3 Planning Meeting"
    >

  </div>

  <!-- Date -->
  <div class="form-group">

    <label>
      Date <span class="required">*</span>
    </label>

    <input
      type="date"
      id="bookingDate"
      onchange="onRoomOrDateChange()"
    >

  </div>

  <!-- Start Time -->
  <div class="form-group">

    <label>
      Start Time <span class="required">*</span>
    </label>

    <select id="startTime" onchange="updateEndTime()">

      <option value="">
        -- Select Time --
      </option>

    </select>

  </div>

  <!-- Duration -->
  <div class="form-group">

    <label>
      Duration <span class="required">*</span>
    </label>

    <div class="duration-row">

      <select id="durationHours" onchange="updateEndTime()">
        <option value="0">0 hr</option>
        <option value="1">1 hr</option>
        <option value="2">2 hr</option>
        <option value="3">3 hr</option>
        <option value="4">4 hr</option>
      </select>

      <select id="durationMins" onchange="updateEndTime()">
        <option value="0">0 min</option>
        <option value="30">30 min</option>
      </select>

    </div>

  </div>

  <!-- End Time -->
  <div class="form-group">

    <label>
      End Time
    </label>

    <input
      type="text"
      id="endTime"
      placeholder="Auto-calculated"
      readonly
    >

  </div>

  <!-- Booked Slots -->
  <div class="form-group full">
    <div class="slots-info" id="slotsInfo"></div>
  </div>

  <!-- Full Name -->
  <div class="form-group">

    <label>
      Full Name <span class="required">*</span>
    </label>

    <input
      type="text"
      id="bookerName"
      placeholder="Your full name"
    >

  </div>

  <!-- Department -->
  <div class="form-group">

    <label>
      Department <span class="required">*</span>
    </label>

    <select id="bookerDept">

      <option value="">
        -- Select Department --
      </option>

      <option value="PJU">PJU</option>

      <option value="Farm - Development">
        Farm - Development
      </option>

      <option value="Factory">
        Factory
      </option>

      <option value="BEET">
        BEET
      </option>

      <option value="ABF">
        ABF
      </option>

      <option value="Marketing">
        Marketing
      </option>

      <option value="HRAISC">
        HRAISC
      </option>

      <option value="Farm - Flock Health">
        Farm - Flock Health
      </option>

      <option value="Farm - Technical">
        Farm - Technical
      </option>

      <option value="Fresh Frozen Chicken (FFC)">
        Fresh Frozen Chicken (FFC)
      </option>

      <option value="Farm - Planning">
        Farm - Planning
      </option>

      <option value="Naka Biolife">
        Naka Biolife
      </option>

      <option value="Sales">
        Sales
      </option>

      <option value="Logistic">
        Logistic
      </option>

      <option value="Outlet Operation">
        Outlet Operation
      </option>

      <option value="Finance And Account">
        Finance And Account
      </option>

      <option value="M & F">
        M & F
      </option>

      <option value="Business Development & IT">
        Business Development & IT
      </option>

      <option value="QC">
        QC
      </option>

    </select>

  </div>

  <!-- Phone Number -->
  <div class="form-group">

    <label>
      Phone Number <span class="required">*</span>
    </label>

    <input
      type="tel"
      id="bookerPhone"
      placeholder="e.g. 0123456789"
    >

  </div>

</div>
