
<style>
  /* ========================= */
/* TOP ACTIONS */
/* ========================= */

.top-actions {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
}

.tab-btn {
  border: none;
  padding: 12px 18px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  background: #e2e8f0;
  color: #1e293b;
  transition: 0.2s;

  display: flex;
  align-items: center;
  gap: 8px;
}

.tab-btn.active {
  background: #3b82f6;
  color: white;
}

/* ========================= */
/* TABLE */
/* ========================= */

.table-container {
  overflow-x: auto;
  margin-top: 20px;
}

#myBookingsTable {
  width: 100%;
  border-collapse: collapse;
}

#myBookingsTable th {
  background: #f1f5f9;
  padding: 12px;
  text-align: left;
  font-size: 14px;
}

#myBookingsTable td {
  padding: 12px;
  border-bottom: 1px solid #e2e8f0;
  font-size: 14px;
}

.status-badge {
  background: #dcfce7;
  color: #166534;
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 12px;
}

.empty {
  text-align: center;
  color: #64748b;
  padding: 20px;
}
</style>
<!-- ========================= -->
<!-- TOP ACTION BUTTONS -->
<!-- ========================= -->

<div class="top-actions">

  <button
    class="tab-btn active"
    id="newBookingBtn"
    onclick="showBookingForm()"
  >
    <i class="fas fa-plus"></i>
    New Booking
  </button>

  <button
    class="tab-btn"
    id="historyBtn"
    onclick="showBookingHistory()"
  >
    <i class="fas fa-list"></i>
    My Bookings
  </button>

</div>

<!-- ========================= -->
<!-- BOOKING FORM -->
<!-- ========================= -->

<div id="bookingFormSection">

  <!-- EXISTING BOOKING FORM HERE -->

</div>

<!-- ========================= -->
<!-- BOOKING HISTORY -->
<!-- ========================= -->

<div id="bookingHistorySection" style="display:none;">

  <div class="card">

    <h3>
      <i
        class="fa-solid fa-list"
        style="color:#3b82f6;margin-right:8px;"
      ></i>

      My Bookings
    </h3>

    <div class="table-container">

      <table id="myBookingsTable">

        <thead>
          <tr>
            <th>Room</th>
            <th>Event</th>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="bookingHistoryList">

          <tr>
            <td colspan="5" class="empty">
              No booking history found
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>

</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<script>

/* ========================= */
/* SWITCH TABS */
/* ========================= */

function showBookingForm() {

  document.getElementById("bookingFormSection")
    .style.display = "block";

  document.getElementById("bookingHistorySection")
    .style.display = "none";

  document.getElementById("newBookingBtn")
    .classList.add("active");

  document.getElementById("historyBtn")
    .classList.remove("active");
}

function showBookingHistory() {

  document.getElementById("bookingFormSection")
    .style.display = "none";

  document.getElementById("bookingHistorySection")
    .style.display = "block";

  document.getElementById("historyBtn")
    .classList.add("active");

  document.getElementById("newBookingBtn")
    .classList.remove("active");

  loadBookingHistory();
}

/* ========================= */
/* LOAD BOOKING HISTORY */
/* ========================= */

async function loadBookingHistory() {

  const historyContainer =
    document.getElementById("bookingHistoryList");

  historyContainer.innerHTML = `
    <tr>
      <td colspan="5" class="empty">
        Loading booking history...
      </td>
    </tr>
  `;

  try {

    const userData =
      localStorage.getItem("user") ||
      sessionStorage.getItem("user");

    const user = JSON.parse(userData);

    const res =
      await fetch(`${API}/api/bookings/user/${user.id}`);

    const bookings = await res.json();

    if (!Array.isArray(bookings) || bookings.length === 0) {

      historyContainer.innerHTML = `
        <tr>
          <td colspan="5" class="empty">
            No booking history found
          </td>
        </tr>
      `;

      return;
    }

    historyContainer.innerHTML = "";

    bookings.forEach(item => {

      historyContainer.innerHTML += `

        <tr>

          <td>${item.room_name || "-"}</td>

          <td>${item.event_name || "-"}</td>

          <td>${item.booking_date || "-"}</td>

          <td>
            ${item.start_time || "-"}
            -
            ${item.end_time || "-"}
          </td>

          <td>
            <span class="status-badge">
              ${item.status || "Approved"}
            </span>
          </td>

        </tr>

      `;
    });

  } catch (err) {

    console.error(err);

    historyContainer.innerHTML = `
      <tr>
        <td colspan="5" class="empty">
          Failed to load booking history
        </td>
      </tr>
    `;
  }
}

</script>
