<style>

/* ========================= */
/* TOP ACTION BUTTONS */
/* ========================= */

.top-actions {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
}

.tab-btn {
  border: none;
  padding: 12px 18px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  background: #e2e8f0;
  color: #1e293b;
  transition: 0.2s;

  display: flex;
  align-items: center;
  gap: 8px;
}

.tab-btn.active {
  background: #3b82f6;
  color: white;
}

.tab-btn:hover {
  opacity: 0.9;
}

/* ========================= */
/* FORM */
/* ========================= */

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-group.full {
  grid-column: 1 / -1;
}

.form-group label {
  font-size: 13px;
  font-weight: 600;
  color: #374151;
}

.form-group label span.required {
  color: #ef4444;
  margin-left: 2px;
}

/* ========================= */
/* INPUT + SELECT */
/* ========================= */

.form-group input,
.form-group select {

  width: 100%;
  padding: 10px 14px;

  border: 1.5px solid #e2e8f0;
  border-radius: 8px;

  font-size: 14px;
  color: #1e293b;

  background: #f8fafc;

  transition: border 0.2s;
  outline: none;
}

/* ========================= */
/* SELECT */
/* ========================= */

.form-group select {
  cursor: pointer;
}

/* ========================= */
/* FOCUS */
/* ========================= */

.form-group input:focus,
.form-group select:focus {
  border-color: #3b82f6;
  background: white;
}

/* ========================= */
/* READ ONLY */
/* ========================= */

.form-group input:read-only {
  background: #f1f5f9;
  color: #64748b;
  cursor: not-allowed;
}

/* ========================= */
/* DURATION */
/* ========================= */

.duration-row {
  display: flex;
  gap: 10px;
}

.duration-row select {
  flex: 1;
}

/* ========================= */
/* HISTORY */
/* ========================= */

.history-card {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  padding: 16px;
  border-radius: 10px;
  margin-bottom: 14px;
}

.history-card h4 {
  margin: 0 0 10px;
}

.history-card p {
  margin: 6px 0;
  color: #475569;
}

.empty {
  text-align: center;
  color: #64748b;
  padding: 20px;
}

/* ========================= */
/* LIVE AVAILABILITY */
/* ========================= */

.check-btn {
  width: 100%;
  padding: 12px;
  border: 2px solid #111827;
  background: #2563eb;
  color: white;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
  margin-bottom: 14px;
}

.check-btn:hover {
  background: #1d4ed8;
}

.availability-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.time-slot-btn {
  padding: 14px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-weight: 500;
  transition: 0.2s;
}

.time-slot-btn.available {
  background: #dcfce7;
  color: #166534;
}

.time-slot-btn.booked {
  background: #fee2e2;
  color: #991b1b;
  cursor: not-allowed;
}

.time-slot-btn.selected {
  background: #2563eb;
  color: white;
}
</style>

<!-- ========================= -->
<!-- TOP BUTTONS -->
<!-- ========================= -->

<div class="top-actions">

  <button
    class="tab-btn active"
    id="newBookingBtn"
    onclick="showBookingForm()"
  >
    <i class="fas fa-plus"></i>
    New Booking
  </button>

  <button
    class="tab-btn"
    id="historyBtn"
    onclick="showBookingHistory()"
  >
    <i class="fas fa-list"></i>
    My Bookings
  </button>

</div>

<!-- ========================= -->
<!-- BOOKING FORM -->
<!-- ========================= -->

<div id="bookingFormSection">

<div class="form-grid">

  <!-- Room Type -->
  <div class="form-group full">

    <label>
      Room Type <span class="required">*</span>
    </label>

    <select id="roomSelect" onchange="onRoomOrDateChange()">

      <option value="">
        -- Select Room --
      </option>

      <option value="1">
        Meeting Room Pejabat Urusan
      </option>

      <option value="2">
        Meeting Room Director
      </option>

      <option value="3">
        The Nest
      </option>

    </select>

  </div>

  <!-- Event Name -->
  <div class="form-group full">

    <label>
      Event Name <span class="required">*</span>
    </label>

    <input
      type="text"
      id="eventName"
      placeholder="e.g. Q3 Planning Meeting"
    >

  </div>

  <!-- Date -->
  <div class="form-group">

    <label>
      Date <span class="required">*</span>
    </label>

    <input
      type="date"
      id="bookingDate"
      onchange="onRoomOrDateChange()"
    >

  </div>

 <!-- Start Time -->
<div class="form-group">

  <label>
    Start Time <span class="required">*</span>
  </label>

  <select id="startTime" onchange="updateEndTime()">

    <option value="">
      -- Select Time --
    </option>

    <option value="08:00">8:00 AM</option>
    <option value="08:30">8:30 AM</option>

    <option value="09:00">9:00 AM</option>
    <option value="09:30">9:30 AM</option>

    <option value="10:00">10:00 AM</option>
    <option value="10:30">10:30 AM</option>

    <option value="11:00">11:00 AM</option>
    <option value="11:30">11:30 AM</option>

    <option value="12:00">12:00 PM</option>
    <option value="12:30">12:30 PM</option>

    <option value="13:00">1:00 PM</option>
    <option value="13:30">1:30 PM</option>

    <option value="14:00">2:00 PM</option>
    <option value="14:30">2:30 PM</option>

    <option value="15:00">3:00 PM</option>
    <option value="15:30">3:30 PM</option>

    <option value="16:00">4:00 PM</option>
    <option value="16:30">4:30 PM</option>

    <option value="17:00">5:00 PM</option>
    <option value="17:30">5:30 PM</option>

    <option value="18:00">6:00 PM</option>
    <option value="18:30">6:30 PM</option>

    <option value="19:00">7:00 PM</option>
    <option value="19:30">7:30 PM</option>

    <option value="20:00">8:00 PM</option>
    <option value="20:30">8:30 PM</option>

    <option value="21:00">9:00 PM</option>
    <option value="21:30">9:30 PM</option>

    <option value="22:00">10:00 PM</option>

  </select>

</div>

  <!-- LIVE AVAILABILITY -->
<div class="form-group full">

  <button
    type="button"
    class="check-btn"
    onclick="checkAvailability()"
  >
    Check Live Availability
  </button>

  <div id="availabilityGrid" class="availability-grid"></div>

</div>

  <!-- Duration -->
  <div class="form-group">

    <label>
      Duration <span class="required">*</span>
    </label>

    <div class="duration-row">

      <select id="durationHours" onchange="updateEndTime()">
        <option value="0">0 hr</option>
        <option value="1">1 hr</option>
        <option value="2">2 hr</option>
        <option value="3">3 hr</option>
        <option value="4">4 hr</option>
      </select>

      <select id="durationMins" onchange="updateEndTime()">
        <option value="0">0 min</option>
        <option value="30">30 min</option>
      </select>

    </div>

  </div>

  <!-- End Time -->
  <div class="form-group">

    <label>
      End Time
    </label>

    <input
      type="text"
      id="endTime"
      placeholder="Auto-calculated"
      readonly
    >

  </div>

  <!-- Booked Slots -->
  <div class="form-group full">
    <div class="slots-info" id="slotsInfo"></div>
  </div>

  <!-- Full Name -->
  <div class="form-group">

    <label>
      Full Name <span class="required">*</span>
    </label>

    <input
      type="text"
      id="bookerName"
      placeholder="Your full name"
    >

  </div>

  <!-- Department -->
  <div class="form-group">

    <label>
      Department <span class="required">*</span>
    </label>

    <select id="bookerDept">

      <option value="">
        -- Select Department --
      </option>

      <option>PJU</option>
      <option>Farm - Development</option>
      <option>Factory</option>
      <option>BEET</option>
      <option>ABF</option>
      <option>Marketing</option>
      <option>HRAISC</option>
      <option>Farm - Flock Health</option>
      <option>Farm - Technical</option>
      <option>Fresh Frozen Chicken (FFC)</option>
      <option>Farm - Planning</option>
      <option>Naka Biolife</option>
      <option>Sales</option>
      <option>Logistic</option>
      <option>Outlet Operation</option>
      <option>Finance And Account</option>
      <option>M & F</option>
      <option>Business Development & IT</option>
      <option>QC</option>

    </select>

  </div>

  <!-- Phone Number -->
  <div class="form-group">

    <label>
      Phone Number <span class="required">*</span>
    </label>

    <input
      type="tel"
      id="bookerPhone"
      placeholder="e.g. 0123456789"
    >

  </div>

</div>

</div>

<!-- ========================= -->
<!-- BOOKING HISTORY -->
<!-- ========================= -->

<div id="bookingHistorySection" style="display:none;">

  <div class="history-card">

    <h3 style="margin-bottom:20px;">
      My Booking History
    </h3>

    <div id="bookingHistoryList">

      <div class="empty">
        No booking history found
      </div>

    </div>

  </div>

</div>

<!-- ========================= -->
<!-- SCRIPT -->
<!-- ========================= -->

<script>

function showBookingForm() {

  document.getElementById("bookingFormSection")
    .style.display = "block";

  document.getElementById("bookingHistorySection")
    .style.display = "none";

  document.getElementById("newBookingBtn")
    .classList.add("active");

  document.getElementById("historyBtn")
    .classList.remove("active");
}

function showBookingHistory() {

  document.getElementById("bookingFormSection")
    .style.display = "none";

  document.getElementById("bookingHistorySection")
    .style.display = "block";

  document.getElementById("historyBtn")
    .classList.add("active");

  document.getElementById("newBookingBtn")
    .classList.remove("active");

  loadBookingHistory();
}

async function loadBookingHistory() {

  const historyContainer =
    document.getElementById("bookingHistoryList");

  historyContainer.innerHTML = `
    <div class="empty">
      Loading booking history...
    </div>
  `;

  try {

    const userData =
      localStorage.getItem("user") ||
      sessionStorage.getItem("user");

    const user = JSON.parse(userData);

    const res =
      await fetch(`${API}/api/bookings/user/${user.id}`);

    const bookings = await res.json();

    if (!Array.isArray(bookings) || bookings.length === 0) {

      historyContainer.innerHTML = `
        <div class="empty">
          No booking history found
        </div>
      `;

      return;
    }

    historyContainer.innerHTML = "";

    bookings.forEach(item => {

      historyContainer.innerHTML += `

        <div class="history-card">

          <h4>${item.event_name}</h4>

          <p>
            <strong>Room:</strong>
            ${item.room_name}
          </p>

          <p>
            <strong>Date:</strong>
            ${item.booking_date}
          </p>

          <p>
            <strong>Time:</strong>
            ${item.start_time} - ${item.end_time}
          </p>

        </div>

      `;
    });

  } catch (err) {

    console.error(err);

    historyContainer.innerHTML = `
      <div class="empty">
        Failed to load booking history
      </div>
    `;
  }
}

async function checkAvailability() {

  const room =
    document.getElementById("roomSelect").value;

  const date =
    document.getElementById("bookingDate").value;

  if (!room || !date) {

    showToast(
      "Please select room and date first",
      "error"
    );

    return;
  }

  const grid =
    document.getElementById("availabilityGrid");

  grid.innerHTML = "";

  try {

    const res =
      await fetch(
        `${API}/api/bookings/slots?room_id=${room}&date=${date}`
      );

    const booked = await res.json();

    const bookedTimes = [];

    booked.forEach(item => {

      bookedTimes.push(
        item.start_time.slice(0,5)
      );
    });

    const slots = [

      "08:00","09:00","10:00","11:00",
      "12:00","13:00","14:00","15:00",
      "16:00","17:00","18:00","19:00",
      "20:00","21:00","22:00"

    ];

    slots.forEach(time => {

      const btn =
        document.createElement("button");

      btn.innerText = time;

      btn.classList.add("time-slot-btn");

      if (bookedTimes.includes(time)) {

        btn.classList.add("booked");

      } else {

        btn.classList.add("available");

        btn.onclick = () => {

          document
            .querySelectorAll(".time-slot-btn")
            .forEach(b =>
              b.classList.remove("selected")
            );

          btn.classList.add("selected");

          document.getElementById("startTime")
            .value = time;

          updateEndTime();
        };
      }

      grid.appendChild(btn);
    });

  } catch (err) {

    console.error(err);

    showToast(
      "Failed to check availability",
      "error"
    );
  }
}

</script>
