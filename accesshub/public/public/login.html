<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <script>
    // ✅ API URL - automatically uses current domain in production
    const API = window.location.origin;
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      height: 45px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
      margin-bottom: 15px; /* ✅ spacing fix */
    }

    input:focus {
      border-color: #3b82f6;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #2563eb;
    }

    .error {
      color: red;
      text-align: center;
      margin-bottom: 10px;
      display: none;
    }

    /* PASSWORD WRAPPER */
    .password-wrapper {
      position: relative;
      height: 45px;
      margin-bottom: 20px;
    }

    .password-wrapper input {
      padding-right: 40px;
    }

    .toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;            
    align-items: center;        
    justify-content: center;    
    height: 100%;               
    cursor: pointer;
    font-size: 16px;
    color: #666;
    }

    .toggle-password:hover {
      color: #000;
    }

    .toggle-password i {
    pointer-events: none; 
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .remember input {
      width: 16px;
      height: 16px;
      margin: 0;
      cursor: pointer;
    }

    .remember label {
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>AccessHub Login</h2>

  <!-- ERROR -->
  <div id="errorMsg" class="error"></div>

  <!-- EMAIL -->
  <input id="email" type="email" placeholder="Enter email">

  <!-- PASSWORD -->
  <div class="password-wrapper">
    <input id="password" type="password" placeholder="Enter password"
       onfocus="checkEmailFirst()">
    <span class="toggle-password" onclick="if(checkEmailFirst()) togglePassword()">
      <i class="fa fa-eye"></i>
    </span>
  </div>

  <!-- BUTTON -->
<button onclick="if(checkEmailFirst()) login()">Login</button>

<!--  REMEMBER ME (FIXED) -->
<div class="remember">
  <input type="checkbox" id="rememberMe">
  <label for="rememberMe">Remember Me</label>
</div>

</div>

<script>
function showError(message) {
  const errorBox = document.getElementById("errorMsg");
  errorBox.innerText = message;
  errorBox.style.display = "block";
}

function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const errorBox = document.getElementById("errorMsg");
  const remember = document.getElementById("rememberMe").checked;

  errorBox.style.display = "none";

  if (!email) {
    showError("Email is required");
    return;
  }

  if (!password) {
    showError("Password is required");
    return;
  }

  fetch("${API}/api/auth/login", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ email, password })
  })
  .then(res => res.json())
  .then(data => {

    if (!data.token) {
      errorBox.innerText = data.message || "Login failed";
      errorBox.style.display = "block";
      return;
    }

    //  REMEMBER ME
    if (remember) {
      localStorage.setItem("token", data.token);
      localStorage.setItem("user", JSON.stringify(data.user));
       localStorage.setItem("role", data.user.role);
    } else {
      sessionStorage.setItem("token", data.token);
      sessionStorage.setItem("user", JSON.stringify(data.user));
      sessionStorage.setItem("role", data.user.role);
    }

    // REDIRECT
    if (data.user.role === "admin") {
      window.location.href = "admin.html";
    } else {
      window.location.href = "index.html";
    }

  })
  .catch(err => {
    console.error(err);
    showError("Server error");
  });
}

function togglePassword() {
  const pass = document.getElementById("password");
  const icon = document.querySelector(".toggle-password i");

  if (pass.type === "password") {
    pass.type = "text";
    icon.classList.replace("fa-eye", "fa-eye-slash");
  } else {
    pass.type = "password";
    icon.classList.replace("fa-eye-slash", "fa-eye");
  }
}

function checkEmailFirst() {
  const email = document.getElementById("email").value.trim();

  if (!email) {
    showError("Please enter email first");
    document.getElementById("email").focus();
    return false;
  }

  return true;
}

document.getElementById("email").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    e.preventDefault();
    if (!this.value.trim()) return showError("Please enter email first");
    document.getElementById("password").focus();
  }
});

document.getElementById("password").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    e.preventDefault();
    if (!this.value.trim()) return showError("Please enter password");
    login();
  }
});
</script>

</body>
</html>
