<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <script>
    const API = window.location.origin;
  </script>
<title>Admin Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* ========================= */
/* RESET */
/* ========================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}                                                                                                     

/* ========================= */
/* LAYOUT - BODY */
/* ========================= */
body {
  font-family: "Segoe UI", sans-serif;                                                                                                                                                                                                                                                                    
  background: #f1f5f9;
  display: flex;
}

/* ========================= */
/* SIDEBAR */
/* ========================= */
.sidebar {
  width: 240px;
  background: #1e293b;
  color: white;
  padding: 20px;
  position: fixed;
  height: 100vh;

  display: flex;              
  flex-direction: column;     
}

.sidebar button {
  width: 100%;
  padding: 12px 16px;
  margin-bottom: 12px;

  border: none;
  border-radius: 10px;

  background: #334155;
  color: #e2e8f0;

  font-size: 14px;
  font-weight: 500;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;

  transition: all 0.25s ease;
}

.sidebar button:hover {
  background: #475569;
  transform: translateX(3px);  
}

.sidebar button.active {
  background: #3b82f6;
  color: white;

  box-shadow: 0 0 0 2px rgba(255,255,255,0.2); /* soft outline */
}

.sidebar button.active {
  background: #3b82f6;
  border: 2px solid rgba(255,255,255,0.6);
}

.sidebar h2 {
  text-align: center;
  margin-bottom: 20px;
}

/* ========================= */
/* LOGOUT BUTTON STYLE */
/* ========================= */

.logout-btn:hover {
  background: #ef4444;   /* red */
  color: white;
}
/* ========================= */
/* MAIN CONTENT */
/* ========================= */
.main {
  margin-left: 240px;
  padding: 30px;
  width: calc(100% - 240px);
}

/* ========================= */
/* CARD */
/* ========================= */
.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
}

/* ========================= */
/* FORM */
/* ========================= */
input, select {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
}

button.primary {
  background: #3b82f6;
  color: white;
  padding: 10px;
  border-radius: 8px;
  border: none;
}

/* ========================= */
/* CHECKBOX */
/* ========================= */
.checkbox-card {
  display: flex;
  align-items: center;
  gap: 10px;
}

.checkbox-card input {
  width: 16px;
  height: 16px;
}

#departmentCheckboxes label {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* ========================= */
/* TABLE BASE */
/* ========================= */
.table-container {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 12px;
}

th {
  background: #e2e8f0;
}

/* ========================= */
/* USERS TABLE */
/* ========================= */

/* Name */
#userTable th:nth-child(1),
#userTable td:nth-child(1) {
  text-align: left;
}

/* Email */
#userTable th:nth-child(2),
#userTable td:nth-child(2) {
  text-align: left;
}

/* Role */
#userTable th:nth-child(3),
#userTable td:nth-child(3) {
  text-align: left;
  width: 120px;
}

/* Departments */
#userTable th:nth-child(4),
#userTable td:nth-child(4) {
  text-align: left;
  padding-left: 40px;
}

/* Action */
#userTable td:last-child {
  text-align: center;
}

/* ========================= */
/* LINKS TABLE */
/* ========================= */

/* name */
#linkTable th:nth-child(1),
#linkTable td:nth-child(1) {
  text-align: left;
}

/* URL */
#linkTable th:nth-child(2),
#linkTable td:nth-child(2) {
  text-align: center;
}

/* Department */
#linkTable th:nth-child(3),
#linkTable td:nth-child(3) {
  text-align: left;
}

/* Action */
#linkTable td:last-child {
  text-align: center;
}

/* link styling */
#linkTable a {
  color: #3b82f6;
  text-decoration: none;
  font-weight: 500;
}

#linkTable a:hover {
  text-decoration: underline;
}

/* ========================= */
/* USERS TABLE */
/* ========================= */

/* Email */
#userTable th:nth-child(1),
#userTable td:nth-child(1) {
  text-align: left;
}

/* Role */
#userTable th:nth-child(2),
#userTable td:nth-child(2) {
  text-align: left;
  width: 120px;
}

/* Departments */
#userTable th:nth-child(3),
#userTable td:nth-child(3) {
  text-align: left;
  padding-left: 40px;
}

/* Action */
#userTable td:last-child {
  text-align: center;
}

/* ========================= */
/* BADGES */
/* ========================= */
.badge {
  background: #e2e8f0;
  padding: 4px 10px;
  border-radius: 6px;
  margin: 2px 4px 2px 0;
  display: inline-block;
}

/* ========================= */
/* ACTION BUTTONS - PRO */
/* ========================= */

.action-buttons {
  display: flex;
  justify-content: center;
  gap: 10px;
}

/* BASE BUTTON */
.action-buttons button {
  display: flex;
  align-items: center;
  gap: 6px;

  padding: 6px 14px;

  border: none;
  border-radius: 8px;

  font-size: 13px;
  font-weight: 500;

  cursor: pointer;

  transition: all 0.25s ease;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

/* EDIT BUTTON */
.edit-btn {
  background: #facc15;
  color: #1e293b;
}

.edit-btn:hover {
  background: #eab308;
  transform: translateY(-2px);
  box-shadow: 0 6px 12px rgba(0,0,0,0.12);
}

/* DELETE BUTTON */
.delete-btn {
  background: #ef4444;
  color: white;
}

.delete-btn:hover {
  background: #dc2626;
  transform: translateY(-2px);
  box-shadow: 0 6px 12px rgba(0,0,0,0.12);
}

/* CLICK EFFECT */
.action-buttons button:active {
  transform: scale(0.95);
}

.action-buttons i {
  font-size: 12px;
}

.icon-only {
  padding: 8px;
  width: 34px;
  height: 34px;
  justify-content: center;
}

#userTable th:last-child,
#userTable td:last-child,
#linkTable th:last-child,
#linkTable td:last-child {
  text-align: center;
}

/* ========================= */
/* MODAL */
/* ========================= */
.modal {
  display: none;              
  position: fixed;
  inset: 0;
  z-index: 999;
  background: rgba(0,0,0,0.4);

  justify-content: center;
  align-items: center;
}

.modal-content {
  background: white;
  padding: 25px;
  border-radius: 12px;
  width: 400px;
  max-height: 80vh;
  overflow-y: auto;
}

/* ========================= */
/* MODAL COMPONENTS */
/* ========================= */
.modal-content h3 {
  margin-bottom: 5px;
}

.user-role {
  font-size: 14px;
  color: #64748b;
  margin-bottom: 15px;
}

.dept-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.dept-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  border-radius: 8px;
  background: #f8fafc;
  cursor: pointer;
}

.dept-item:hover {
  background: #e2e8f0;
}

/* ========================= */
/* MODAL BUTTONS */
/* ========================= */
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
}

.btn-cancel {
  background: #e5e7eb;
  padding: 8px 14px;
  border-radius: 8px;
  border: none;
}

.btn-update {
  background: #3b82f6;
  color: white;
  padding: 8px 14px;
  border-radius: 8px;
  border: none;
}

.btn-delete {
  background: #ef4444;
  color: white;
  padding: 8px 14px;
  border-radius: 8px;
  border: none;
}

/* ========================= */
/* MODERN TOAST */
/* ========================= */
.toast {
  position: fixed;
  top: 20px;
  right: 20px;

  background: #ffffff;
  color: #1e293b;

  padding: 12px 16px;
  border-radius: 10px;

  font-size: 14px;
  font-weight: 500;

  box-shadow: 0 8px 25px rgba(0,0,0,0.1);

  /* 🔥 ADD THESE */
  width: auto;
  max-width: 300px;        /* control length */
  display: inline-block;   /* prevent full width */

  opacity: 0;
  transform: translateY(-20px);
  transition: all 0.3s ease;

  z-index: 1000;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

.toast {
  word-wrap: break-word;
}


/* ========================= */
/* FIX ACTION COLUMN */
/* ========================= */

/* apply to BOTH tables */
#userTable th:last-child,
#userTable td:last-child,
#linkTable th:last-child,
#linkTable td:last-child {
  text-align: center;
}

/* ========================= */
/* LOGOUT BUTTON */
/* ========================= */

.logout-btn {
  margin-top: auto;   /* push to bottom */

  background: #334155;   /* same as other buttons initially */
  color: #e2e8f0;

  border: none;
  border-radius: 10px;

  padding: 12px 16px;
  font-size: 14px;
  font-weight: 500;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;

  cursor: pointer;

  border-top: 1px solid rgba(255,255,255,0.1);
  margin-top: auto;
  padding-top: 15px;

  transition: all 0.25s ease;
}

/* 🔥 HOVER (RED) */
.sidebar .logout-btn:hover {
  background: #ef4444;
  color: white;
  transform: translateX(3px);
}

/* OPTIONAL: ACTIVE CLICK EFFECT */
.sidebar .logout-btn:active {
  transform: scale(0.97);
}

/* ========================= */
/* ANIMATION */
/* ========================= */
@keyframes pop {
  from { transform: scale(0.9); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
</style>
</head>

<body>

<!-- ========================= -->
<!--  EDIT USER MODAL -->
<!-- ========================= -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <h3>Edit User</h3>
    <input type="text" id="editName" placeholder="Name">
    <input type="email" id="editEmail" placeholder="Email">
    <input type="password" id="editPassword" placeholder="New Password (optional)">

    <h4>Departments</h4>
    <div id="editDepartments"></div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
      <button class="btn-update" onclick="confirmEdit()">Update</button>
    </div>
  </div>
</div>


<!-- ========================= -->
<!--  DELETE MODAL (FIXED POSITION) -->
<!-- ========================= -->
<div id="deleteModal" class="modal">
  <div class="modal-content delete-box">

    <h3>Confirm Delete</h3>
    <p id="deleteMessage">Are you sure you want to delete this?</p>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
      <button class="btn-delete" onclick="confirmDelete()">Delete</button>
    </div>

  </div>
</div>

<!-- ========================= -->
<!-- SIDEBAR -->
<!-- ========================= -->
<div class="sidebar">
  <h2>Admin Panel</h2>
  <button onclick="showSection('usersSection')">Users</button>
  <button onclick="showSection('linksSection')">Links</button>
  <button class="logout-btn" onclick="openLogoutModal()">Logout</button>
</div>

<!-- ========================= -->
<!-- MAIN -->
<!-- ========================= -->
<div class="main">

<!-- ========================= -->
<!-- USERS SECTION -->
<!-- ========================= -->
<div id="usersSection">

  <div class="card">
    <h3>Create User</h3>

    <input id="name" placeholder="Name">
    <input id="email" placeholder="Email">
    <input id="password" placeholder="Password">

    <select id="role">
      <option value="user">User</option>
      <option value="admin">Admin</option>
    </select>

    <div id="departmentCheckboxes"></div>
    

    <button class="primary" onclick="createUser()">Create User</button>
  </div>

  <div class="card">
    <h3>Users List</h3>

    <div class="table-container">
      <table id="userTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Departments</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

</div>

<div id="toast" class="toast"></div>

<!-- ========================= -->
<!-- LINKS SECTION -->
<!-- ========================= -->
<div id="linksSection" style="display:none;">

  <div class="card">
    <h3>Add Link</h3>

    <input id="linkName" placeholder="Link Name">
    <input id="linkURL" placeholder="URL">

    <select id="linkDepartment"></select>

    <button class="primary" onclick="createLink()">Add Link</button>
  </div>

  <div class="card">
    <h3>Links List</h3>

    <div class="table-container">
      <table id="linkTable">
        <thead>
          <tr>
            <th>Link Name</th>
            <th>URL</th>
            <th>Department</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

  </div>

</div>

</div>

<!-- ========================= -->
<!-- EDIT LINK MODAL -->
<!-- ========================= -->
<div id="editLinkModal" class="modal">
  <div class="modal-content">
   
  <i class="fa-solid fa-pen"></i>
</button>

    <h3>Edit Link</h3>

    <input type="text" id="editLinkName" placeholder="Link Name">
    <input type="text" id="editLinkURL" placeholder="URL">

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeEditLinkModal()">Cancel</button>
      <button class="btn-update" onclick="updateLink()">Update</button>
    </div>

  </div>
</div>

<!-- ========================= -->
<!-- LOGOUT MODAL -->
<!-- ========================= -->
<div id="logoutModal" class="modal">
  <div class="modal-content">

    <h3>Confirm Logout</h3>
    <p>Are you sure you want to logout?</p>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeLogoutModal()">Cancel</button>
      <button class="btn-delete" onclick="confirmLogout()">Logout</button>
    </div>

  </div>
</div>


<script>

/* ===================================================== */
/* GLOBAL VARIABLES */
/* ===================================================== */
let editingUserId = null;
let editingLinkId = null;

let deleteType = null;
let deleteId = null;

/* ===================================================== */
/* SECTION SWITCHING */
/* ===================================================== */
function showSection(id) {
  document.getElementById("usersSection").style.display = "none";
  document.getElementById("linksSection").style.display = "none";
  document.getElementById(id).style.display = "block";
}

/* ===================================================== */
/* TOAST */
/* ===================================================== */
function showToast(message, type = "default") {
  const toast = document.getElementById("toast");

  toast.classList.remove("show");
  void toast.offsetWidth;

  toast.innerText = message;

  if (type === "error") {
    toast.style.borderLeft = "4px solid #ef4444";
  }

  toast.classList.add("show");

  setTimeout(() => {
    toast.classList.remove("show");
  }, 2500);
}

/* ===================================================== */
/* LOAD DEPARTMENTS */
/* ===================================================== */
async function loadDepartments() {
  const res = await fetch(`${API}/api/departments`);
  const data = await res.json();

  const checkbox = document.getElementById("departmentCheckboxes");
  checkbox.innerHTML = "";

  data.forEach(dep => {
    checkbox.innerHTML += `
      <label class="checkbox-card">
        <input type="checkbox" value="${dep.id}">
        ${dep.name}
      </label>
    `;
  });
}

/* ===================================================== */
/* LOAD LINK DROPDOWN */
/* ===================================================== */
async function loadLinkDepartments() {
  const res = await fetch(`${API}/api/departments`);
  const data = await res.json();

  const dropdown = document.getElementById("linkDepartment");
  dropdown.innerHTML = "<option value=''>Select Department</option>";

  data.forEach(dep => {
    dropdown.innerHTML += `
      <option value="${dep.id}">${dep.name}</option>
    `;
  });
}

/* ===================================================== */
/* LOAD USERS */
/* ===================================================== */
async function loadUsers() {
  const res = await fetch(`${API}/api/users`);
  const users = await res.json();

  const tbody = document.querySelector("#userTable tbody");
  tbody.innerHTML = "";

  users.forEach(user => {
    tbody.innerHTML += `
      <tr>
        <td>${user.name || "-"}</td>
        <td>${user.email}</td>
        <td>${user.role}</td>

        <td>
          ${
            user.departments?.map(d =>
              `<span class="badge">${d.name}</span>`
            ).join("") || "-"
          }
        </td>

        <td>
          <div class="action-buttons">

            <button 
              class="edit-btn icon-only"
              onclick="editUser(${user.id})">
              <i class="fa-solid fa-pen"></i>
            </button>

            <button 
              class="delete-btn icon-only"
              onclick="openDeleteModal('user', ${user.id})">
              <i class="fa-solid fa-trash"></i>
            </button>

          </div>
        </td>
      </tr>
    `;
  });
}

/* ===================================================== */
/* CREATE USER */
/* ===================================================== */
async function createUser() {
  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const role = document.getElementById("role").value;

  const deps = [];
  document.querySelectorAll("#departmentCheckboxes input:checked")
    .forEach(cb => deps.push(cb.value));

  if (!name || !email || !password) {
    showToast("Please fill all fields", "error");
    return;
  }

  const res = await fetch(`${API}/api/users`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ name, email, password, role, departments: deps })
  });

  if (!res.ok) {
    showToast("Failed to create user", "error");
    return;
  }

  showToast("User created!");
  loadUsers();
}

/* ===================================================== */
/* LOAD LINKS */
/* ===================================================== */
async function loadLinks() {
  const res = await fetch(`${API}/api/links`);
  const links = await res.json();

  const tbody = document.querySelector("#linkTable tbody");
  tbody.innerHTML = "";

  links.forEach(link => {
    tbody.innerHTML += `
      <tr>
        <td>${link.name}</td>
        <td><a href="${link.url}" target="_blank">Open</a></td>
        <td>${link.department_name}</td>
        <td>
          <div class="action-buttons">
            <button class="edit-btn icon-only"
              onclick="editLink(${link.id}, '${link.name}', '${link.url}')">
              <i class="fa-solid fa-pen"></i>
            </button>

            <button class="delete-btn icon-only"
              onclick="openDeleteModal('link', ${link.id})">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </td>
      </tr>
    `;
  });
}

/* ===================================================== */
/* CREATE LINK */
/* ===================================================== */
async function createLink() {
  const name = document.getElementById("linkName").value;
  const url = document.getElementById("linkURL").value;
  const department_id = document.getElementById("linkDepartment").value;

  if (!name || !url || !department_id) {
    showToast("Please fill all fields", "error");
    return;
  }

  const res = await fetch(`${API}/api/links`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ name, url, department_id })
  });

  if (!res.ok) {
    showToast("Failed to add link", "error");
    return;
  }

  showToast("Link added!");
  loadLinks();
}

/* ===================================================== */
/* EDIT LINK */
/* ===================================================== */
function editLink(id, name, url) {
  editingLinkId = id;

  document.getElementById("editLinkName").value = name;
  document.getElementById("editLinkURL").value = url;

  document.getElementById("editLinkModal").style.display = "flex";
}

function closeEditLinkModal() {
  document.getElementById("editLinkModal").style.display = "none";
}

async function updateLink() {
  const name = document.getElementById("editLinkName").value;
  const url = document.getElementById("editLinkURL").value;

  await fetch(`${API}/api/links/${editingLinkId}`, {
    method: "PUT",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ name, url })
  });

  showToast("Link updated!");
  closeEditLinkModal();
  loadLinks();
}

/* ===================================================== */
/* DELETE */
/* ===================================================== */
function openDeleteModal(type, id) {
  deleteType = type;
  deleteId = id;
  document.getElementById("deleteModal").style.display = "flex";
}

function closeDeleteModal() {
  document.getElementById("deleteModal").style.display = "none";
}

async function confirmDelete() {
  let url = deleteType === "link"
    ? `${API}/api/links/${deleteId}`
    : `${API}/api/users/${deleteId}`;

  await fetch(url, { method: "DELETE" });

  showToast("Deleted!");
  closeDeleteModal();

  if (deleteType === "link") loadLinks();
  else loadUsers();
}

/* ===================================================== */
/* INIT */
/* ===================================================== */
document.addEventListener("DOMContentLoaded", async () => {
  console.log("INIT RUNNING...");

  try {
    await loadDepartments();
    await loadLinkDepartments();
    await loadUsers();
    await loadLinks();
    console.log("INIT SUCCESS");
  } catch (err) {
    console.error("INIT ERROR:", err);
    showToast("Failed to load data", "error");
  }
});

/* ===================================================== */
/* EDIT USER */
/* ===================================================== */
async function editUser(id) {

  const resUser = await fetch(`${API}/api/users/${id}`);
  const user = await resUser.json();

  const resDep = await fetch(`${API}/api/departments`);
  const departments = await resDep.json();

  editingUserId = id;

  document.getElementById("editModal").style.display = "flex";

  document.getElementById("editName").value = user.name || "";
  document.getElementById("editEmail").value = user.email || "";

  const container = document.getElementById("editDepartments");
  container.innerHTML = "";

  departments.forEach(dep => {

    const checked = user.departments?.some(d => d.id === dep.id);

    container.innerHTML += `
      <label class="checkbox-card">
        <input type="checkbox" value="${dep.id}" ${checked ? "checked" : ""}>
        <span>${dep.name}</span>
      </label>
    `;
  });
}

function closeEditModal() {
  document.getElementById("editModal").style.display = "none";
}

/* ===================================================== */
/* UPDATE USER */
/* ===================================================== */
async function confirmEdit() {

  const name = document.getElementById("editName").value;
  const email = document.getElementById("editEmail").value;
  const password = document.getElementById("editPassword").value;

  const deps = [];
  document.querySelectorAll("#editDepartments input:checked")
    .forEach(cb => deps.push(cb.value));

  const body = { name, email, departments: deps };

  if (password) {
    body.password = password;
  }

  await fetch(`${API}/api/users/${editingUserId}`, {
    method: "PUT",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)
  });

  showToast("User updated!");

  closeEditModal();
  loadUsers();
}

/* ===================================================== */
/* LOGOUT */
/* ===================================================== */
function openLogoutModal() {
  document.getElementById("logoutModal").style.display = "flex";
}

function closeLogoutModal() {
  document.getElementById("logoutModal").style.display = "none";
}

function confirmLogout() {
  localStorage.clear();
  sessionStorage.clear();

  showToast("Logged out successfully");

  setTimeout(() => {
    window.location.href = "login.html";
  }, 800);
}

</script>
