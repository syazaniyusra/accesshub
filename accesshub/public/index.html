<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bismi AccessHub</title>

  <script>const API = window.location.origin;</script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ══════════════════════════════════════
     SIDEBAR
══════════════════════════════════════ -->
<div class="sidebar">

  <!-- Brand -->
  <div class="sidebar-brand">
    <div class="sidebar-logo-wrap">
      <img src="bismi_jpg__2_.jpeg" alt="Bismi" class="sidebar-logo">
    </div>
    <div class="sidebar-brand-text">
      <span class="sidebar-brand-name">Bismi</span>
      <span class="sidebar-brand-sub">Segar Halal Suci</span>
    </div>
  </div>

  <!-- Nav -->
  <nav class="sidebar-nav" id="sidebarNav">
    <span class="sidebar-section-label">Link Management</span>
    <!-- Department buttons injected here -->

    <span class="sidebar-section-label" id="othersLabel">Others</span>
    <button class="booking-btn" onclick="loadBookingPage(this)">
      <i class="fas fa-door-open"></i> Room Booking
    </button>
    <button class="booking-btn" onclick="loadTrainingPage(this)">
      <i class="fas fa-graduation-cap"></i> Training Module
    </button>

    <span class="sidebar-section-label">General</span>
    <button class="booking-btn" onclick="loadProfilePage(this)">
      <i class="fas fa-user-circle"></i> Profile
    </button>
  </nav>

  <!-- Footer -->
  <div class="sidebar-footer">
    <button class="logout-btn" onclick="logout()">
      <i class="fas fa-sign-out-alt"></i> Logout
    </button>
  </div>

</div>


<!-- ══════════════════════════════════════
     MAIN
══════════════════════════════════════ -->
<div class="main">

  <!-- Dashboard -->
  <div id="dashboardPage">

    <div class="page-header">
      <h2 class="page-title">
        <div class="page-title-icon"><i class="fas fa-th-large"></i></div>
        Access<span class="accent">Hub</span>
      </h2>
      <p class="page-subtitle">Welcome back — select a link below to get started</p>
    </div>

    <div class="search-bar">
      <div class="input-group">
        <input type="text" id="searchInput" placeholder="Search links..." aria-label="Search">
        <button type="button" id="searchBtn" aria-label="Search">
          <i class="fas fa-search"></i>
        </button>
      </div>
    </div>

    <div id="dashboard"></div>

  </div>

  <!-- Booking -->
  <div id="bookingPage" style="display:none;"></div>

  <!-- Profile -->
  <div id="profilePage" style="display:none;">
    <div class="page-header">
      <h2 class="page-title">
        <div class="page-title-icon"><i class="fas fa-user"></i></div>
        My <span class="accent">Profile</span>
      </h2>
      <p class="page-subtitle">View your account details and manage your password</p>
    </div>

    <div class="profile-grid">

      <!-- Info Card -->
      <div class="profile-card">
        <div class="profile-avatar" id="profileAvatar"></div>
        <div class="profile-info">
          <div class="profile-field">
            <span class="profile-label"><i class="fas fa-user"></i> Full Name</span>
            <span class="profile-value" id="profileName">—</span>
          </div>
          <div class="profile-field">
            <span class="profile-label"><i class="fas fa-envelope"></i> Email</span>
            <span class="profile-value" id="profileEmail">—</span>
          </div>
          <div class="profile-field">
            <span class="profile-label"><i class="fas fa-layer-group"></i> Departments</span>
            <div class="profile-tags" id="profileDepts"></div>
          </div>
          <div class="profile-field">
            <span class="profile-label"><i class="fas fa-shield-alt"></i> Role</span>
            <span class="profile-value" id="profileRole">—</span>
          </div>
        </div>
      </div>

      <!-- Change Password Card -->
      <div class="profile-card">
        <div class="profile-card-title">
          <i class="fas fa-lock"></i> Change Password
        </div>

        <div id="pwMsg" class="pw-msg" style="display:none;"></div>

        <div class="pw-field">
          <label>Current Password</label>
          <div class="pw-input-wrap">
            <input type="password" id="pwCurrent" placeholder="Enter current password">
            <button type="button" onclick="togglePw('pwCurrent', this)"><i class="fas fa-eye"></i></button>
          </div>
        </div>

        <div class="pw-field">
          <label>New Password</label>
          <div class="pw-input-wrap">
            <input type="password" id="pwNew" placeholder="Min. 6 characters">
            <button type="button" onclick="togglePw('pwNew', this)"><i class="fas fa-eye"></i></button>
          </div>
        </div>

        <div class="pw-field">
          <label>Confirm New Password</label>
          <div class="pw-input-wrap">
            <input type="password" id="pwConfirm" placeholder="Repeat new password">
            <button type="button" onclick="togglePw('pwConfirm', this)"><i class="fas fa-eye"></i></button>
          </div>
        </div>

        <button class="pw-save-btn" onclick="changePassword()">
          <i class="fas fa-save"></i> Update Password
        </button>
      </div>

    </div>
  </div>

</div>


<!-- ══════════════════════════════════════
     SCRIPTS
══════════════════════════════════════ -->
<script>

let allData = [];

async function loadLinks() {
  try {
    const res  = await fetch(`${API}/api/links`);
    const data = await res.json();
    if (!Array.isArray(data)) return;

    const filtered = data.filter(link =>
      !window.userDepartmentIds?.length ||
      window.userDepartmentIds.includes(Number(link.department_id))
    );

    allData = filtered;
    renderDashboard(filtered);
  } catch (e) { console.error(e); }
}

async function loadDepartments() {
  try {
    const userData = localStorage.getItem("user") || sessionStorage.getItem("user");
    const user = JSON.parse(userData);

    const res         = await fetch(`${API}/api/users/${user.id}/departments`);
    const departments = await res.json();
    if (!Array.isArray(departments)) return;

    window.userDepartmentIds = departments.map(d => d.id);
    window.userDepartments    = departments;
    generateSidebar(departments);
  } catch (e) { console.error(e); }
}

function renderDashboard(data, keyword = "") {
  const container = document.getElementById("dashboard");
  container.innerHTML = "";

  if (!data.length) {
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon"><i class="fas fa-search"></i></div>
        <p>${keyword ? `No results for "${keyword}"` : "No links available"}</p>
      </div>`;
    return;
  }

  data.forEach(link => {
    container.innerHTML += `
      <div class="card">
        <div class="card-icon"><i class="fas fa-link"></i></div>
        <div class="card-body"><h4>${link.name}</h4></div>
        <a href="${link.url}" target="_blank" class="link-btn">
          Open <i class="fas fa-arrow-up-right-from-square"></i>
        </a>
      </div>`;
  });
}

function generateSidebar(departments) {
  const nav        = document.getElementById("sidebarNav");
  const othersLabel = document.getElementById("othersLabel");

  // Remove previous dept buttons
  nav.querySelectorAll("button:not(.booking-btn)").forEach(b => b.remove());

  const allBtn = document.createElement("button");
  allBtn.innerHTML = '<i class="fas fa-border-all"></i> All';
  allBtn.onclick = () => { showDashboard(); setActive(allBtn); renderDashboard(allData); };

  const firstLabel = nav.querySelector(".sidebar-section-label");
  firstLabel.insertAdjacentElement("afterend", allBtn);
  let insertRef = allBtn;

  departments.forEach(dep => {
    if (dep.name.toLowerCase() === "room booking") return;
    const btn = document.createElement("button");
    btn.innerHTML = `<i class="fas fa-folder"></i> ${dep.name}`;
    btn.onclick = () => {
      showDashboard();
      setActive(btn);
      renderDashboard(allData.filter(i => Number(i.department_id) === Number(dep.id)));
    };
    insertRef.insertAdjacentElement("afterend", btn);
    insertRef = btn;
  });

  setActive(allBtn);
}

function setActive(btn) {
  document.querySelectorAll(".sidebar button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}

function showDashboard() {
  document.getElementById("dashboardPage").style.display = "block";
  document.getElementById("bookingPage").style.display   = "none";
  document.getElementById("profilePage").style.display   = "none";
}

function showPage(id) {
  ["dashboardPage","bookingPage","profilePage"].forEach(p => {
    document.getElementById(p).style.display = p === id ? "block" : "none";
  });
}

async function loadTrainingPage(button) {
  setActive(button);
  document.getElementById("dashboardPage").style.display = "none";
  const bc = document.getElementById("bookingPage");
  bc.style.display = "block";
  bc.innerHTML = `<div class="empty"><div class="empty-icon"><i class="fas fa-graduation-cap"></i></div><p>Training Module coming soon</p></div>`;
}

function loadProfilePage(button) {
  setActive(button);
  showPage("profilePage");

  const userData = localStorage.getItem("user") || sessionStorage.getItem("user");
  const role     = localStorage.getItem("role")  || sessionStorage.getItem("role");
  const user     = JSON.parse(userData);

  // Avatar initials
  const initials = (user.name || user.username || "U")
    .split(" ").map(w => w[0]).join("").toUpperCase().slice(0,2);
  document.getElementById("profileAvatar").textContent = initials;

  document.getElementById("profileName").textContent  = user.name  || user.username || "—";
  document.getElementById("profileEmail").textContent = user.email || "—";
  document.getElementById("profileRole").textContent  = role ? role.charAt(0).toUpperCase() + role.slice(1) : "—";

  // Departments
  const deptsEl = document.getElementById("profileDepts");
  deptsEl.innerHTML = "";
  if (window.userDepartments?.length) {
    window.userDepartments.forEach(d => {
      const tag = document.createElement("span");
      tag.className = "dept-tag";
      tag.textContent = d.name;
      deptsEl.appendChild(tag);
    });
  } else {
    deptsEl.innerHTML = "<span style='color:var(--ink-light)'>—</span>";
  }
}

function togglePw(inputId, btn) {
  const input = document.getElementById(inputId);
  const isText = input.type === "text";
  input.type = isText ? "password" : "text";
  btn.querySelector("i").className = isText ? "fas fa-eye" : "fas fa-eye-slash";
}

async function changePassword() {
  const current = document.getElementById("pwCurrent").value.trim();
  const newPw   = document.getElementById("pwNew").value.trim();
  const confirm = document.getElementById("pwConfirm").value.trim();
  const msgEl   = document.getElementById("pwMsg");

  function showMsg(text, type) {
    msgEl.textContent = text;
    msgEl.className = "pw-msg " + type;
    msgEl.style.display = "block";
    setTimeout(() => { msgEl.style.display = "none"; }, 4000);
  }

  if (!current || !newPw || !confirm) return showMsg("Please fill in all fields.", "error");
  if (newPw.length < 6)              return showMsg("New password must be at least 6 characters.", "error");
  if (newPw !== confirm)             return showMsg("Passwords do not match.", "error");

  const userData = localStorage.getItem("user") || sessionStorage.getItem("user");
  const user     = JSON.parse(userData);
  const token    = localStorage.getItem("token") || sessionStorage.getItem("token");

  try {
    const res  = await fetch(`${API}/api/users/${user.id}/change-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
      body: JSON.stringify({ currentPassword: current, newPassword: newPw })
    });
    const data = await res.json();

    if (res.ok) {
      showMsg("Password updated successfully!", "success");
      document.getElementById("pwCurrent").value = "";
      document.getElementById("pwNew").value     = "";
      document.getElementById("pwConfirm").value = "";
    } else {
      showMsg(data.message || "Failed to update password.", "error");
    }
  } catch {
    showMsg("Server error. Please try again.", "error");
  }
}

async function loadBookingPage(button) {
  setActive(button);
  document.getElementById("dashboardPage").style.display = "none";
  const bc = document.getElementById("bookingPage");
  bc.style.display = "block";
  if (bc.innerHTML.trim()) return;

  try {
    let html = await (await fetch("booking.html")).text();
    html = html.replace(/<!DOCTYPE html>[\s\S]*?<body>/i, "");
    html = html.replace(/<\/body>[\s\S]*<\/html>/i, "");
    html = html.replace(/<!-- SIDEBAR -->[\s\S]*?<!-- MAIN -->/i, "");
    html = html.replace(/<div class="main">/i, "").replace(/<\/div>\s*$/, "");
    bc.innerHTML = html;
    bc.querySelectorAll("script").forEach(s => {
      const n = document.createElement("script");
      s.src ? (n.src = s.src) : (n.textContent = s.textContent);
      document.body.appendChild(n); s.remove();
    });
  } catch {
    bc.innerHTML = `<div class="empty"><div class="empty-icon"><i class="fas fa-exclamation-triangle"></i></div><p>Failed to load booking page</p></div>`;
  }
}

function doSearch() {
  const kw = document.getElementById("searchInput").value.toLowerCase();
  renderDashboard(allData.filter(i => i.name.toLowerCase().includes(kw)), kw);
}

document.getElementById("searchInput").addEventListener("keyup",    doSearch);
document.getElementById("searchBtn").addEventListener("click",      doSearch);
document.getElementById("searchInput").addEventListener("keypress", e => { if (e.key === "Enter") doSearch(); });

function logout() { localStorage.clear(); sessionStorage.clear(); window.location.href = "login.html"; }

document.addEventListener("DOMContentLoaded", async () => {
  const token    = localStorage.getItem("token")    || sessionStorage.getItem("token");
  const role     = localStorage.getItem("role")     || sessionStorage.getItem("role");
  const userData = localStorage.getItem("user")     || sessionStorage.getItem("user");

  if (!token || !userData) { window.location.href = "login.html"; return; }
  if (role === "admin")    { window.location.href = "admin.html"; return; }

  window.currentUserId = JSON.parse(userData).id;
  await loadDepartments();
  await loadLinks();
});

</script>
</body>
</html>
